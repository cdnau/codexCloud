idth=\"157.0\" height=\"90\" rx=\"12\" fill=\"#284238\" stroke=\"#72936a\"/><text x=\"98.5\" y=\"120\" text-anchor=\"middle\">Capture</text><text x=\"98.5\" y=\"150\" text-anchor=\"middle\" font-size=\"13\">กล้อง / ไมโครโฟน</text><path d=\"M178.0 130h17\" stroke=\"#9abf91\" marker-end=\"url(#arrow)\"/><rect x=\"195.0\" y=\"85\" width=\"157.0\" height=\"90\" rx=\"12\" fill=\"#284238\" stroke=\"#72936a\"/><text x=\"273.5\" y=\"120\" text-anchor=\"middle\">Digitize</text><text x=\"273.5\" y=\"150\" text-anchor=\"middle\" font-size=\"13\">ADC</text><path d=\"M353.0 130h17\" stroke=\"#9abf91\" marker-end=\"url(#arrow)\"/><rect x=\"370.0\" y=\"85\" width=\"157.0\" height=\"90\" rx=\"12\" fill=\"#284238\" stroke=\"#72936a\"/><text x=\"448.5\" y=\"120\" text-anchor=\"middle\">Process</text><text x=\"448.5\" y=\"150\" text-anchor=\"middle\" font-size=\"13\">CPU / GPU / NPU</text><path d=\"M528.0 130h17\" stroke=\"#9abf91\" marker-end=\"url(#arrow)\"/><rect x=\"545.0\" y=\"85\" width=\"157.0\" height=\"90\" rx=\"12\" fill=\"#284238\" stroke=\"#72936a\"/><text x=\"623.5\" y=\"120\" text-anchor=\"middle\">Present</text><text x=\"623.5\" y=\"150\" text-anchor=\"middle\" font-size=\"13\">จอ / ลำโพง</text></g></svg><figcaption>อุปกรณ์แต่ละส่วนร่วมกันเปลี่ยนปรากฏการณ์ทางกายภาพเป็นข้อมูลดิจิทัล แล้วนำกลับมาแสดงให้มนุษย์รับรู้</figcaption></figure>"};const fullExam="<p> เนื้อหาสำหรับเตรียมสอบ</p>\n<h2>1. สิ่งที่ยืนยันจากขอบเขตที่แจ้ง</h2>\n<p>ปรนัยครอบคลุม ทุกบท 6–12 จึงไม่ควรอ่านเฉพาะสามหัวข้อของอัตนัย</p>\n<p>อัตนัยอยู่ใน Sound/Audio, Hypermedia และ Streaming ควรฝึกตอบแบบ “ความหมาย → หลักการ → ขั้นตอน → เหตุผล → ตัวอย่าง” เพราะการท่องคำศัพท์อย่างเดียวอาจไม่เพียงพอ</p>\n<p>อัตนัยมี 14 จาก 40 คะแนน หรือ 35% ของคะแนนทั้งหมด จึงควรเผื่อเวลาฝึกเขียนจริง</p>\n<h2>2. เช็กลิสต์ปรนัยรายบท</h2>\n<p>รายการนี้เป็นประเด็นที่ควรทบทวนจากเนื้อหาและ Learning Outcomes ไม่ใช่การยืนยันว่าทุกประเด็นจะมีข้อสอบ</p>\n<div class=\"tablewrap\"><table><tr><th>บท</th><th>ประเด็นที่ควรตอบได้ทันที</th></tr><tr><td>6 Graphics</td><td>Bitmap/Vector, Rasterization, Bézier และจำนวน Control Points, Affine, Boolean, Extrusion/Lathe, Mesh, Rendering และ Shading</td></tr><tr><td>7 Animation</td><td>ประเภท Animation, Keyframe/Tweening, Interpolation, Continuity, Path/Speed, Morphing, FK/IK</td></tr><tr><td>8 Sound</td><td>Sound/Audio, Frequency/Amplitude, Sampling/Bit Depth, Clipping/Dither, Filter/EQ, Reverb, Vocoder/Auto-Tune, Compression, Synthesis, HRTF</td></tr><tr><td>9 Text</td><td>Character/Glyph/Font/Typeface, ASCII/Unicode, UTF, Endianness, Kerning/Tracking/Leading, Bitmap/Outline Font</td></tr><tr><td>10 Hypermedia</td><td>Linear/Nonlinear, Hypertext/Hypermedia, MEMEX, HTML/HTTP/URL/DOM, CSS/JS, DOM API, Worker, WCMS</td></tr><tr><td>11 Networking</td><td>Real-time, Throughput/Latency, TCP/UDP/QUIC, RTP/RTCP, Streaming สามแบบ, RTSP/RTMP/HLS/DASH, CDN, DRM</td></tr><tr><td>12 Devices</td><td>CPU/GPU/NPU, Integrated/Discrete GPU, คุณสมบัติจอ, LCD/OLED, Accelerometer/Gyroscope, Haptic</td></tr></table></div>\n<p>3. คู่คำที่ควรแยกให้ได้ก่อนเข้าห้องสอบ</p>\n<div class=\"tablewrap\"><table><tr><th>คู่ที่สับสนง่าย</th><th>วิธีจำ</th></tr><tr><td>Sampling Rate / Bit Depth</td><td>ถี่แค่ไหนตามเวลา / ละเอียดแค่ไหนตามระดับ</td></tr><tr><td>Quantization / Clipping</td><td>ปัดเข้าสู่ระดับที่มี / เกินขอบเขตที่รับได้</td></tr><tr><td>Filter / EQ</td><td>เลือกหรือลดย่าน / ปรับสมดุลย่าน</td></tr><tr><td>Vocoder / Auto-Tune</td><td>ลักษณะเสียงจาก Carrier–Modulator / แก้ Pitch</td></tr><tr><td>Lossless / Lossy</td><td>คืนข้อมูลครบ / ยอมสูญเสียบางส่วน</td></tr><tr><td>Codec / Container</td><td>วิธีเข้ารหัส / โครงสร้างบรรจุ</td></tr><tr><td>Character / Glyph</td><td>หน่วยอักขระ / รูปที่แสดง</td></tr><tr><td>Unicode / UTF-8</td><td>ระบบหมายเลขอักขระ / รูปแบบเข้ารหัส</td></tr><tr><td>Kerning / Tracking</td><td>ปรับคู่ / ปรับทั้งช่วง</td></tr><tr><td>DOM / DOM API</td><td>โครงสร้าง / วิธีเข้าถึงโครงสร้าง</td></tr><tr><td>RTSP / RTP</td><td>ควบคุม Session / ส่งข้อมูลสื่อ</td></tr><tr><td>Ingest / Delivery</td><td>ส่งเข้าแพลตฟอร์ม / ส่งถึงผู้ชม</td></tr><tr><td>Transcoding / Packaging</td><td>เข้ารหัสใหม่ / จัดรูปแบบส่ง</td></tr><tr><td>HTTPS / DRM</td><td>ป้องกันระหว่างทาง / ควบคุมสิทธิ์</td></tr><tr><td>Resolution / PPI</td><td>จำนวนพิกเซล / ความหนาแน่น</td></tr><tr><td>Refresh Rate / FPS</td><td>จออัปเดต / เนื้อหาสร้างเฟรม</td></tr></table></div>\n<h2>4. แนวอัตนัย Sound/Audio พร้อมตัวอย่างคำตอบ</h2>\n<p>คำถามฝึก: อธิบายกระบวนการบันทึกเสียงเป็นดิจิทัล ปัจจัยที่มีผลต่อคุณภาพ และความแตกต่างระหว่าง Lossless กับ Lossy Compression</p>\n<p>ตัวอย่างคำตอบ</p>\n<p>เสียงเป็นคลื่นความดันที่แพร่ผ่านตัวกลาง การบันทึกเริ่มจากไมโครโฟนแปลงความดันเสียงเป็นสัญญาณไฟฟ้าแอนะล็อก จากนั้นปรับ Gain ให้เหมาะสมเพื่อให้สัญญาณมีระดับเพียงพอและไม่เกินช่วงรับของระบบ เพราะอาจเกิด Clipping</p>\n<p>ก่อนแปลงเป็นดิจิทัล ระบบจำกัดย่านความถี่เพื่อลด Aliasing แล้ว ADC ทำ Sampling และ Quantization โดย Sampling Rate กำหนดจำนวนตัวอย่างต่อวินาที ส่วน Bit Depth กำหนดจำนวนระดับที่ใช้แทนค่า Amplitude เช่น 16 บิตมี 65,536 ระดับ ทั้งสองจึงควบคุมความละเอียดคนละด้าน</p>\n<p>Quantization ทำให้เกิดความต่างระหว่างค่าจริงกับค่าที่ใช้แทน การใช้ Bit Depth สูงขึ้นช่วยลดความผิดพลาดนี้ ส่วน Dithering คือการเติม Noise ระดับต่ำเพื่อทำให้ความเพี้ยนจาก Quantization ไม่สัมพันธ์กับสัญญาณ โดยมักใช้เมื่อลด Bit Depth และไม่ได้ใช้แก้ Clipping</p>\n<p>เมื่อได้ข้อมูลดิจิทัล สามารถบีบอัดแบบ Lossless เช่น FLAC โดยเก็บข้อมูลอย่างมีประสิทธิภาพและถอดกลับเป็นต้นฉบับได้ครบ หรือแบบ Lossy เช่น AAC และ MP3 ซึ่งใช้หลัก Psychoacoustics เช่น Threshold of Hearing, Frequency Masking และ Temporal Masking เพื่อลดรายละเอียดที่รับรู้ได้น้อย ทำให้ไฟล์เล็กลง แต่ไม่สามารถคืนข้อมูลเดิมทั้งหมดได้</p>\n<p>องค์ประกอบที่ควรมีในคำตอบ: ไมโครโฟน, Gain/Clipping, Sampling, Quantization, Sampling Rate ต่างจาก Bit Depth, Dither และหลักการของ Compression สองแบบ</p>\n<p>คำถามฝึกเพิ่มเติม</p>\n<div class=\"bullet\">• เปรียบเทียบ Stereo กับ Binaural Audio และอธิบาย HRTF</div>\n<div class=\"bullet\">• อธิบาย Frequency Masking กับ Temporal Masking</div>\n<div class=\"bullet\">• เปรียบเทียบ Filter, EQ, Vocoder และ Auto-Tune โดยยกตัวอย่างการใช้งาน</div>\n<h2>5. แนวอัตนัย Hypermedia พร้อมตัวอย่างคำตอบ</h2>\n<p>คำถามฝึก: อธิบาย Hypermedia และความสัมพันธ์ระหว่าง HTML, CSS, JavaScript, DOM และ Web Worker ในแอปมัลติมีเดียบนเว็บ</p>\n<p>ตัวอย่างคำตอบ</p>\n<p>Hypermedia คือการจัดเนื้อหาหลายชนิด เช่น ข้อความ ภาพ เสียง และวิดีโอ ให้เชื่อมโยงกัน ผู้ใช้สามารถเลือกเส้นทางเข้าถึงแบบ Nonlinear ได้ เช่น บทเรียนที่คลิกจากคำอธิบายไปฟังเสียงหรือดูวิดีโอ ต่างจากสื่อที่กำหนดลำดับการรับชมเพียงเส้นทางเดียว</p>\n<p>บนเว็บ HTML กำหนดโครงสร้างและความหมายของเนื้อหา CSS กำหนดการนำเสนอ และ JavaScript เพิ่มพฤติกรรมโต้ตอบ เมื่อ Browser อ่าน HTML จะสร้าง DOM ซึ่งเป็นโครงสร้างวัตถุในหน่วยความจำ JavaScript ใช้ DOM API ค้นหา เพิ่ม ลบ หรือแก้ไของค์ประกอบเหล่านี้ เช่น เปลี่ยนข้อความเมื่อผู้ใช้กดปุ่ม หรือควบคุมการเล่นวิดีโอ</p>\n<p>Browser ต้องทำงานหลายอย่างบน Main Thread รวมถึงการรัน JavaScript และคำนวณ Layout หากโปรแกรมประมวลผลสื่อหนักต่อเนื่อง หน้าเว็บอาจตอบสนองช้า จึงสามารถย้ายงานคำนวณที่เหมาะสมไปยัง Web Worker แล้วส่งผลกลับด้วย Message ให้ Main Thread อัปเดตหน้า โดย Worker ทั่วไปไม่เข้าถึง DOM ของหน้าโดยตรง</p>\n<p>ตัวอย่างคือเว็บวิเคราะห์เสียง ให้ Worker วิเคราะห์ข้อมูลเสียงและส่งผลกลับมา ส่วน Main Thread แสดงกราฟและรับการกดปุ่ม ทำให้การคำนวณกับการตอบสนองของหน้าแยกหน้าที่กันชัดเจน</p>\n<p>องค์ประกอบที่ควรมีในคำตอบ: Nonlinear, การเชื่อมสื่อ, หน้าที่ HTML/CSS/JS, DOM ต่างจาก DOM API, Main Thread และข้อจำกัดของ Worker</p>\n<p>คำถามฝึกเพิ่มเติม</p>\n<div class=\"bullet\">• MEMEX มีแนวคิดใดที่คล้ายกับเว็บปัจจุบัน</div>\n<div class=\"bullet\">• Hypermedia ต่างจาก Multimedia อย่างไร</div>\n<div class=\"bullet\">• WCMS มี CMA และ CDA ทำหน้าที่อะไร และช่วยผู้จัดทำเว็บอย่างไร</div>\n<h2>6. แนวอัตนัย Streaming พร้อมตัวอย่างคำตอบ</h2>\n<p>คำถามฝึก: อธิบายกระบวนการ Live Streaming แบบ Adaptive Bitrate โดยเปรียบเทียบ HLS กับ DASH และอธิบายบทบาทของ CDN</p>\n<p>ตัวอย่างคำตอบ</p>\n<p>Live Streaming เริ่มจากกล้องและไมโครโฟนรับภาพกับเสียง แล้ว Encoder เข้ารหัสสื่อก่อนส่งเข้าแพลตฟอร์มผ่าน Ingest Protocol เช่น RTMP หรือ RTMPS จากนั้นระบบอาจ Transcode เพื่อสร้างสื่อหลายความละเอียดและหลาย Bitrate ก่อน Packaging เป็น Segments พร้อม Manifest</p>\n<p>HLS และ DASH ใช้แนวคิดแบ่งสื่อเป็นช่วงและส่งผ่าน HTTP โดย HLS ใช้ Playlist แบบ M3U8 ส่วน DASH ใช้ MPD ซึ่งเขียนด้วย XML Manifest ช่วยให้ Player ทราบว่ามีข้อมูลใดให้เลือกและต้องดาวน์โหลดตามลำดับอย่างไร</p>\n<p>Player ประเมิน Throughput และสถานะ Buffer เพื่อเลือก Representation หากเครือข่ายดีสามารถเพิ่มคุณภาพ หากเครือข่ายช้าลงอาจลด Bitrate เพื่อให้ยังดาวน์โหลดทันการเล่น แนวทางนี้เรียกว่า Adaptive Bitrate Streaming และมีเป้าหมายลดการหยุดรอข้อมูล ไม่ใช่รักษาความละเอียดสูงสุดตลอดเวลา</p>\n<p>CDN ช่วยกระจาย Segments ไปยัง Server หลายตำแหน่งและ Cache เนื้อหา ลดภาระ Origin และรองรับผู้ชมพร้อมกันจำนวนมาก ส่วน Buffer ช่วยรับความแปรปรวนของเครือข่าย แต่การสะสมข้อมูลมากขึ้นก็เพิ่มความหน่วง จึงต้องเลือกระหว่างความต่อเนื่องกับความใกล้เวลาจริงตามลักษณะงาน</p>\n<p>หากเป็น Video Conference ที่ต้องโต้ตอบกัน ความหน่วงมีความสำคัญมาก จึงอาจเลือกชุดเทคโนโลยีอย่าง WebRTC แทนรูปแบบ Streaming ที่เน้นกระจายผู้ชมจำนวนมาก</p>\n<p>องค์ประกอบที่ควรมีในคำตอบ: Ingest, Transcoding, Packaging, Segments, Manifest, ABR, Buffer, CDN และความต่าง HLS/DASH</p>\n<p>คำถามฝึกเพิ่มเติม</p>\n<div class=\"bullet\">• Progressive Download ต่างจาก Segmented Streaming อย่างไร</div>\n<div class=\"bullet\">• เหตุใด Video Conference จึงยอมให้ Buffer ยาวมากแบบดูหนังไม่ได้</div>\n<div class=\"bullet\">• RTMP, HLS และ CDN ทำงานร่วมกันในระบบเดียวได้อย่างไร</div>\n<div class=\"bullet\">• HTTPS, DRM และ Watermark ทำหน้าที่ต่างกันอย่างไร</div>\n<h2>7. แนวอัตนัยแบบเชื่อมหลายหัวข้อ</h2>\n<p>เพราะมีอัตนัย 2 ข้อแต่ระบุไว้ 3 หัวข้อ จึงควรเตรียมรับโจทย์ที่เชื่อมกัน เช่น</p>\n<p>“ออกแบบแนวทางทำเว็บเรียนออนไลน์ที่มีเสียงและวิดีโอ ผู้เรียนเลือกหัวข้อได้ และรองรับเครือข่ายหลายระดับ”</p>\n<p>โครงคำตอบที่ใช้ได้คือ</p>\n<p>1. ใช้ Hypermedia เชื่อมบทเรียนให้เลือกเส้นทางได้</p>\n<p>2. ใช้ HTML สร้างเนื้อหา CSS จัดรูปแบบ และ JavaScript ควบคุมการโต้ตอบผ่าน DOM API</p>\n<p>3. บันทึกเสียงด้วย Sampling Rate/Bit Depth ที่เหมาะสม ตั้ง Gain ไม่ให้ Clipping และเลือก Codec ให้ตรงงาน</p>\n<p>4. ใช้ HLS หรือ DASH เพื่อส่งวิดีโอหลาย Bitrate</p>\n<p>5. ใช้ CDN รองรับผู้ชมจำนวนมาก</p>\n<p>6. แยกงานคำนวณหนักที่เหมาะสมไป Worker เพื่อรักษาการตอบสนองของหน้า</p>\n<p>7. ใช้ HTTPS และหากต้องควบคุมสิทธิ์เนื้อหา จึงเพิ่มระบบ DRM</p>\n<p>คำตอบแบบนี้ควรอธิบาย เหตุผลของแต่ละส่วน เช่น ใช้ ABR เพราะความเร็วเครือข่ายผู้เรียนต่างกัน ไม่ใช่เพียงเขียนรายชื่อเทคโนโลยี</p>\n<h2>8. แบบทดสอบสั้นก่อนสอบ</h2>\n<p>ลองตอบเองก่อนดูเฉลย</p>\n<div class=\"tablewrap\"><table><tr><th>ข้อ</th><th>คำถาม</th><th>เฉลย</th></tr><tr><td>1</td><td>Cubic Bézier ใช้จุดควบคุมกี่จุด</td><td>4 จุด</td></tr><tr><td>2</td><td>Boolean ใดเก็บเฉพาะส่วนทับซ้อน</td><td>AND / Intersection</td></tr><tr><td>3</td><td>การหมุนหน้าตัดรอบแกนเพื่อสร้างแจกันคืออะไร</td><td>Lathe</td></tr><tr><td>4</td><td>กำหนดตำแหน่งมือแล้วหามุมแขนคือ FK หรือ IK</td><td>IK</td></tr><tr><td>5</td><td>เพิ่ม Bit Depth เพิ่มความละเอียดด้านใด</td><td>ระดับ Amplitude</td></tr><tr><td>6</td><td>Dither ใช้แก้ Clipping หรือไม่</td><td>ไม่ ใช้จัดการความเพี้ยนจาก Quantization</td></tr><tr><td>7</td><td>Filter ใดผ่านความถี่สูงและลดความถี่ต่ำ</td><td>High-pass</td></tr><tr><td>8</td><td>การปรับช่องไฟเฉพาะคู่ “AV” เรียกว่าอะไร</td><td>Kerning</td></tr><tr><td>9</td><td>UTF-8 ใช้ขนาดเท่ากันทุก Code Point หรือไม่</td><td>ไม่ ใช้ 1–4 ไบต์</td></tr><tr><td>10</td><td>JavaScript จัดการโครงสร้างหน้าเว็บผ่านอะไร</td><td>DOM API</td></tr><tr><td>11</td><td>Worker ทั่วไปเปลี่ยน DOM ของหน้าโดยตรงได้หรือไม่</td><td>ไม่ได้</td></tr><tr><td>12</td><td>Manifest ของ DASH เรียกว่าอะไร</td><td>MPD</td></tr><tr><td>13</td><td>RTMP ปัจจุบันพบมากในขั้นใดของ Live Streaming</td><td>Ingest</td></tr><tr><td>14</td><td>Sensor ใดวัดอัตราการหมุน</td><td>Gyroscope</td></tr></table></div>\n<p>9. สิ่งที่ควรทำได้ก่อนเข้าห้องสอบ</p>\n<div class=\"bullet\">• เปรียบเทียบคำศัพท์ในตารางโดยไม่เปิดเอกสาร</div>\n<div class=\"bullet\">• คำนวณ Bitrate และขนาด PCM โดยใส่หน่วยถูกต้อง</div>\n<div class=\"bullet\">• อธิบายการแปลงเสียงเป็นดิจิทัลตั้งแต่ไมโครโฟนจนถึงข้อมูล</div>\n<div class=\"bullet\">• อธิบาย HTML → DOM → JavaScript/DOM API → การเปลี่ยนหน้า</div>\n<div class=\"bullet\">• เขียนลำดับ Camera → Ingest → Transcode → Package → CDN → Player</div>\n<div class=\"bullet\">• ตอบเหตุผลว่าเหตุใดต้องใช้ Dither, Worker, Buffer, ABR และ CDN</div>\n<div class=\"bullet\">• ฝึกเขียนอัตนัยทั้งสามหัวข้อให้เป็นย่อหน้าที่เชื่อมเหตุและผล พร้อมตัวอย่างอย่างน้อยหนึ่งกรณีต่อหัวข้อ</div>";
read=function(n){const c=fullChapters[n];if(!c){location.hash='home';return}app.innerHTML=`<article class="reading"><span class="tag">CHAPTER ${n} · เนื้อหาฉบับเต็ม</span><h1>${safe(c.title)}</h1><div class="row readercontrols"><button onclick="document.documentElement.style.setProperty('--reader-size','17px')">ก เล็ก</button><button onclick="document.documentElement.style.setProperty('--reader-size','20px')">ก ใหญ่</button><button onclick="window.print()">พิมพ์บทนี้</button><button id="markFull">${done.includes(n)?'✓ อ่านจบแล้ว':'ทำเครื่องหมายว่าอ่านจบ'}</button></div>${chapterFigures[n]}<details class="toc"><summary>สารบัญบทนี้</summary><div id="fulltoc"></div></details><div class="section">${c.html}</div><div class="row"><a href="#quiz">ทำแบบทดสอบ →</a>${n<12?`<a href="#ch${n+1}">บทถัดไป →</a>`:''}<a href="#exam">คู่มือเตรียมสอบฉบับเต็ม →</a></div></article>`;let hs=app.querySelectorAll('.section h2');hs.forEach((h,i)=>{h.id='topic'+i;let a=document.createElement('a');a.textContent=h.textContent;a.href='#';a.onclick=e=>{e.preventDefault();h.scrollIntoView({behavior:'smooth'})};document.querySelector('#fulltoc').append(a)});document.querySelector('#markFull').onclick=()=>{done=done.includes(n)?done.filter(v=>v!==n):[...done,n];save('mm-done',done);read(n)};typeset()};function typeset(){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([app]).catch(()=>{})}const originalRoute=route;route=function(){originalRoute();nav.insertAdjacentHTML('beforeend','<a href="#exam">▤ คู่มือเตรียมสอบฉบับเต็ม</a>');if(location.hash==='#exam'){app.innerHTML='<article class="reading"><span class="tag">EXAM GUIDE</span><h1>เตรียมสอบฉบับเต็ม</h1><div class="section">'+fullExam+'</div></article>';typeset()}if(location.hash==='#essay'){app.insertAdjacentHTML('afterbegin','<p><a href="#exam">อ่านแนวอัตนัยและคำตอบฉบับละเอียด →</a></p>')}};window.removeEventListener('hashchange',originalRoute);window.addEventListener('hashchange',route);route();
</script></html>
