:root{--bg:#f5f4ef;--ink:#233c37;--muted:#73827b;--line:#dce2d9;--accent:#d9ed75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 Tahoma,sans-serif}button,input,select,textarea{font:inherit}button,a,input,textarea,select{outline-offset:4px}button,a{cursor:pointer}a{color:inherit}button{border:1px solid var(--line);border-radius:9px;padding:9px 18px;background:white;color:var(--ink)}button:hover{background:#edf2df}.active,.primary{background:var(--ink)!important;color:white!important}aside{position:fixed;width:258px;height:100vh;padding:30px 22px;background:#fff;border-right:1px solid var(--line);overflow:auto}.brand{font-size:24px;font-weight:bold;letter-spacing:-1px}.brand small{display:block;font-size:11px;letter-spacing:3px;color:var(--muted)}nav a{display:block;text-decoration:none;border-radius:9px;padding:10px 12px;margin:4px 0;font-size:14px}nav a:hover{background:#f1f5e8}nav .label{font-size:11px;letter-spacing:2px;color:var(--muted);margin:24px 12px 9px}main{margin-left:258px;padding:34px 5%;max-width:1550px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:35px;font-size:13px;color:var(--muted)}h1{font-size:clamp(30px,4vw,49px);line-height:1.35;letter-spacing:-1px;margin:14px 0}h2{font-size:23px}h3{font-size:19px}p{margin:12px 0}.muted{color:var(--muted)}.tag{font-size:12px;padding:4px 10px;background:#e6eddf;border-radius:20px;display:inline-block}.hero{background:var(--ink);color:white;border-radius:18px;padding:35px 40px;position:relative;overflow:hidden}.hero p{max-width:580px;color:#cbd8cc}.hero .tag{background:#496157;color:#ecf5d8}.hero button{background:var(--accent);border:0;margin-top:15px}.stats{display:flex;gap:38px;margin-top:28px}.stats b{font-size:28px;display:block}.stats span{font-size:12px;color:#cbd8cc}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}.card{background:#ff </style><aside><div class="brand">multimedia<span style="color:#8ca351">.</span><small>YOUR STUDY SPACE</small></div><nav id="nav"></nav><p class="muted" style="font-size:12px">เรียนรู้ทีละบท<br>เข้าใจให้ชัด ก่อนเข้าห้องสอบ</p></aside><main><header><span>เทคโนโลยีสื่อประสม / บทที่ 06–12</span><span>STUDY ROOM · 2026</span></header><div id="app"></div><footer>เรียบเรียงจากเอกสารประกอบการเรียน 7 บท · แบบทดสอบเป็นแนวฝึก ไม่ใช่ข้อสอบจริง<br>ความคืบหน้าและคำตอบอัตนัยบันทึกเฉพาะเบราว์เซอร์นี้</footer></main><script>const chapters=[{"n": 6, "title": "2D & 3D Graphics", "sections": [{"title": "Bitmap และ Vector", "text": "Bitmap เก็บค่าสีเป็นตารางพิกเซล เหมาะกับภาพถ่ายและฉากธรรมชาติ ส่วน Vector เก็บรูปทรงและพารามิเตอร์ เช่น เส้น วงกลม สี และตำแหน่ง จึงวาดใหม่ได้ตามความละเอียดที่ต้องการ เหมาะกับโลโก้และไอคอน แต่ไม่ได้มีไฟล์เล็กกว่าเสมอไปหากรูปทรงซับซ้อนมาก"}, {"title": "Point, Vector และ Rasterization", "text": "Point ระบุตำแหน่ง ส่วน Vector มีขนาดและทิศทาง เช่น จาก (1,2) ไป (4,6) ได้เวกเตอร์ (3,4) ความยาว 5 หน่วย Modeling กำหนดรูปร่าง ขณะที่ Rendering สร้างภาพ การแสดง Vector บนจอต้อง Rasterize เป็นพิกเซล"}, {"title": "Bézier Curve", "text": "Linear ใช้ 2 จุด Quadratic ใช้ 3 จุด และ Cubic ใช้ 4 จุด จุดแรกและสุดท้ายเป็นปลายเส้น ส่วนจุดภายในควบคุมรูปร่าง เส้นไม่จำเป็นต้องผ่านจุดควบคุมภายใน สมการ Linear คือ P(t)=(1−t)P₀+tP₁ เมื่อ t อยู่ระหว่าง 0 และ 1"}, {"title": "คุณสมบัติและ Transformation", "text": "Stroke คือเส้นขอบ ส่วน Fill คือพื้นที่ภายใน Affine ได้แก่ เลื่อน หมุน ย่อขยาย สะท้อน และเฉือน โดยรักษาความขนาน แต่ไม่จำเป็นต้องรักษามุมหรือความยาว Perspective อาจทำให้เส้นขนานดูเหมือนลู่เข้าหากัน"}, {"title": "Boolean Operations", "text": "AND เก็บเฉพาะส่วนทับซ้อน OR รวมพื้นที่ทั้งหมด Difference A−B ตัดพื้นที่ B ออกจาก A ส่วน XOR รวมพื้นที่โดยตัดส่วนทับซ้อนออก ลำดับของ Difference มีผลต่อคำตอบ"}, {"title": "3D Modeling", "text": "เริ่มจาก Primitives เช่นกล่อง ทรงกลม หรือทรงกระบอก แล้วใช้ Transformation และ Boolean ประกอบกัน Extrusion ยืดหน้าตัดให้มีความลึก ส่วน Lathe หมุนหน้าตัดรอบแกน เช่นสร้างแจกัน"}, {"title": "Polygon Mesh และพื้นผิว", "text": "Mesh ประกอบด้วย Vertex จุดยอด Edge เส้นขอบ และ Face หน้ารูปหลายเหลี่ยม เพิ่ม Polygon ทำให้แทนรูปทรงละเอียดขึ้นแต่ใช้ทรัพยากรมาก Material กำหนดการตอบสนองต่อแสง Texture เพิ่มรายละเอียดพื้นผิว"}, {"title": "3D Rendering", "text": "นำโมเดล วัสดุ แสง และกล้องมาสร้างภาพ ขั้นย่อคือ Perspective Projection → Visibility Check → Shading โดย Specular สะท้อนเป็นทิศทางเด่น ส่วน Diffuse กระจายแสง Flat ใช้ค่าต่อหน้า Gouraud แทรกค่าสีจากจุดยอด Phong แทรก Normal แล้วคำนวณแสงต่อจุดภาพ"}]}, {"n": 7, "title": "Computer Animation", "sections": [{"title": "ประเภท Animation", "text": "Traditional วาดภาพทีละเฟรม Cel แยกตัวละครกับฉากหลังเพื่อใช้ซ้ำ Multiplane สร้างความลึกด้วย Parallax ส่วน Stop-motion ขยับวัตถุจริงแล้วถ่ายทีละเฟรม Computer-based hand-drawn ยังวาดทีละเฟรมแต่ใช้เครื่องมือดิจิทัล เช่น Onion Skinning"}, {"title": "Keyframe และ Tweening", "text": "Keyframe กำหนดสถานะสำคัญ In-between คือเฟรมระหว่างสถานะ Tweening คือการสร้างค่าระหว่างเฟรมหลัก สามารถเปลี่ยนตำแหน่ง ขนาด มุม สี ความโปร่งใส และรูปร่างได้"}, {"title": "Interpolation", "text": "V(t)=(1−t)V₀+tV₁ เช่นเริ่ม 20 จบ 80 ที่ t=0.25 ได้ 35 เส้น Bézier ช่วยกำหนดทั้งรูปร่าง เส้นทาง และรูปแบบการเปลี่ยนค่าตามเวลา"}, {"title": "Continuity", "text": "C⁰/G⁰ คือปลายชนกัน G¹ มีแนวสัมผัสทิศเดียวกัน C¹ อนุพันธ์อันดับหนึ่งเท่ากันทั้งขนาดและทิศ C² อนุพันธ์อันดับสองต่อเนื่อง หากพารามิเตอร์คือเวลา จึงเชื่อมโยงกับความเร็วและความเร่ง G² หมายถึงความต่อเนื่องของความโค้ง"}, {"title": "Path และ Speed Control", "text": "Path บอกว่าจะผ่านตำแหน่งใด Speed Control บอกว่าจะถึงเมื่อไร เพิ่มพารามิเตอร์เท่ากันอาจได้ระยะไม่เท่ากัน จึงใช้ Arc Length ช่วยแปลงเวลาเป็นระยะแล้วหาตำแหน่ง Ease-in เริ่มช้า Ease-out ช้าช่วงท้าย Ease-in-out ช้าทั้งต้นและท้าย"}, {"title": "Motion, Shape และ Morphing", "text": "Motion เปลี่ยนตำแหน่ง มุม หรือขนาด Shape เปลี่ยนรูปร่างและคุณสมบัติ Squash and Stretch ยุบยืดโดยรักษาปริมาตรที่รับรู้ Morphing ประกอบด้วย Point Mapping → Warping → Cross-dissolving การผสมภาพอย่างเดียวไม่ใช่การปรับรูปร่าง"}, {"title": "เทคนิคขั้นสูง", "text": "Hierarchical Modeling ทำให้ส่วนลูกได้รับผลจากส่วนแม่ FK กำหนดมุมข้อต่อเพื่อหาตำแหน่งปลาย IK กำหนดตำแหน่งปลายเพื่อหามุมข้อต่อ Physically-based Animation จำลองน้ำ ไฟ ผ้า และการชน Motion Capture บันทึกการเคลื่อนไหวจริงเพื่อขับตัวละคร"}]}, {"n": 8, "title": "Sound / Audio", "sections": [{"title": "Sound และ Audio", "text": "Sound คือคลื่นการสั่นผ่านตัวกลาง Audio คือการแทนเสียงด้วยสัญญาณอิเล็กทรอนิกส์ มีทั้ง Analog และ Digital ช่วงการได้ยินโดยประมาณคือ 20 Hz–20 kHz และแตกต่างตามบุคคล"}, {"title": "คุณสมบัติและ Spectrum", "text": "Amplitude สัมพันธ์กับระดับเสียง Frequency สัมพันธ์กับ Pitch และ c=fλ เชื่อมความเร็ว ความถี่ และความยาวคลื่น Fourier Transform วิเคราะห์องค์ประกอบความถี่ Spectrum แสดงระดับในแต่ละความถี่ เสียงโน้ตเดียวกันอาจมี Timbre ต่างกัน"}, {"title": "Decibel และ dBFS", "text": "ความเข้มใช้ L=10log₁₀(I/I₀) เพิ่ม 10 dB คือความเข้ม 10 เท่า เพิ่ม 20 dB คือ 100 เท่า แต่ความดังที่รู้สึกไม่เพิ่มในสัดส่วนเดียวกัน dBFS อ้างอิง Full Scale โดย 0 dBFS คือเต็มสเกล ไม่ใช่ความเงียบ"}, {"title": "การบันทึกเสียงดิจิทัล", "text": "ไมโครโฟนแปลงความดันเสียงเป็นไฟฟ้า ตั้ง Gain และเผื่อ Headroom จากนั้นจำกัดย่านความถี่ก่อน ADC ทำ Sampling และ Quantization Sampling Rate คือจำนวนตัวอย่างต่อวินาที Bit Depth คือความละเอียดของระดับสัญญาณ N บิตแทนได้ 2ᴺ ระดับ"}, {"title": "Sampling และ Aliasing", "text": "ต้องจำกัดความถี่และใช้อัตราสุ่มตัวอย่างมากกว่าสองเท่าของความถี่สูงสุดที่ต้องการเก็บ ระบบจริงต้องเผื่อการทำงานของตัวกรองด้วย Sampling Rate สูงขึ้นไม่ใช่สิ่งเดียวกับ Bit Depth สูงขึ้น"}, {"title": "คำนวณ PCM", "text": "Bitrate = Sampling Rate × Bit Depth × จำนวนช่อง ขนาดไบต์ = Bitrate × เวลา ÷ 8 เช่น 48 kHz 16-bit Stereo 60 วินาที = 11,520,000 ไบต์ หรือ 11.52 MB ไม่รวมส่วนหัว สูตรนี้ใช้กับ PCM ไม่บีบอัด"}, {"title": "Clipping, Quantization และ Dither", "text": "Clipping เกิดจากเกินช่วงรับจนยอดคลื่นถูกตัด Quantization Error คือความต่างจากการแทนค่าด้วยระดับจำกัด Dither เติม Noise ต่ำก่อนลด Bit Depth เพื่อลดความเพี้ยนที่สัมพันธ์กับสัญญาณ ไม่ได้ซ่อม Clipping สูตร SQNR≈6.02N+1.76 dB มีสมมติฐานสัญญาณและ Quantizer อุดมคติ"}, {"title": "Filters และ EQ", "text": "Low-pass ผ่านความถี่ต่ำ High-pass ผ่านความถี่สูง Band-pass ผ่านเฉพาะช่วง Band-stop ลดช่วงที่กำหนด Graphic EQ ใช้ย่านค่อนข้างตายตัว Parametric EQ ปรับความถี่ศูนย์กลาง Gain และความกว้างย่านได้"}, {"title": "Reverb", "text": "ประกอบด้วย Direct Sound, Early Reflections และ Late Reverberation ช่วยสื่อขนาดและลักษณะห้อง Echo ได้ยินแยกเป็นครั้ง ส่วน Reverb เป็นเสียงสะท้อนหนาแน่นซ้อนกัน Dry คือเสียงเดิม Wet คือเสียงผ่านเอฟเฟกต์"}, {"title": "Vocoder และ Auto-Tune", "text": "Vocoder ใช้ลักษณะเสียง Modulator ควบคุม Carrier เช่นเสียงเครื่องดนตรีให้คล้ายพูด Auto-Tune ตรวจ Pitch → เทียบโน้ตใน Scale → ปรับ Pitch ความเร็วในการแก้ส่งผลต่อความเป็นธรรมชาติหรือเอฟเฟกต์หุ่นยนต์"}, {"title": "Lossless Compression", "text": "ใช้ความซ้ำซ้อนและการทำนาย เช่นเก็บ Residual ระหว่างค่าจริงกับค่าคาดการณ์ โดยเก็บข้อมูลครบจึงถอดกลับได้ตรงต้นฉบับ ตัวอย่าง FLAC, ALAC, Dolby TrueHD"}, {"title": "Lossy Compression", "text": "ใช้ Psychoacoustics ได้แก่ Threshold of Hearing, Frequency Masking และ Temporal Masking เพื่อลดข้อมูลที่รับรู้ได้น้อย แล้วจัดสรรบิตตามความสำคัญ ตัวอย่าง MP3 AAC Vorbis Codec คือวิธีเข้ารหัส ส่วน M4A และ Ogg เป็น Container"}, {"title": "Sound Synthesis", "text": "Additive รวมคลื่น Subtractive ตัดความถี่จากคลื่น FM ใช้ Modulator เปลี่ยนความถี่ Carrier Granular แบ่งเสียงเป็น Grains แล้วผสมใหม่ Wavetable อ่านรูปคลื่นจากตาราง Sample-based เล่นเสียงที่บันทึกไว้"}, {"title": "Stereo และ Spatial Audio", "text": "ITD คือเวลามาถึงหูต่างกัน ILD คือระดับต่างกัน HRTF อธิบายการกรองเสียงจากศีรษะและใบหูตามทิศทาง Stereo ใช้ L/R ส่วน Binaural จำลองเสียงที่แต่ละหูควรได้รับเพื่อสื่อทิศทาง 3D และมักใช้หูฟัง Spatial Audio เป็นคำกว้างกว่า Binaural"}]}, {"n": 9, "title": "Text & Typography", "sections": [{"title": "Character, Typeface, Font และ Glyph", "text": "Character คือหน่วยอักขระ Typeface คือการออกแบบชุดตัวอักษร Font คือรูปแบบดิจิทัลที่นำไปใช้ Glyph คือรูปที่แสดง ไม่จำเป็นต้องสัมพันธ์แบบหนึ่งต่อหนึ่ง เพราะมี Ligature และรูปตามบริบท"}, {"title": "ASCII และ Code Page", "text": "ASCII ใช้ 7 บิต รวม 128 ค่า ระบบ 8 บิตใช้ Code Page ขยาย แต่หากเลือกผิดจะแสดงข้อความผิด จำนวนรหัสจำกัดและรองรับหลายภาษาไม่สะดวก"}, {"title": "Unicode และ UTF", "text": "Unicode กำหนด Code Point เช่น ก = U+0E01 แล้วใช้ UTF แปลงเป็นหน่วยข้อมูล ลำดับคือ Character → Code Point → Code Unit → Bytes มี 17 Planes โดย Plane 0 คือ BMP"}, {"title": "UTF-8 / UTF-16 / UTF-32", "text": "UTF-8 ใช้ 1–4 ไบต์ต่อ Scalar Value อักษรไทยทั่วไปใช้ 3 ไบต์ UTF-16 ใช้ 1–2 หน่วยขนาด 16 บิต UTF-32 ใช้ 4 ไบต์ จำนวนตัวที่เห็นอาจต่างจากจำนวน Code Points และจำนวนไบต์"}, {"title": "Endianness", "text": "Big-endian เก็บไบต์สำคัญมากก่อน เช่น 12 34 56 78 ส่วน Little-endian เก็บ 78 56 34 12 สำหรับค่า 0x12345678 สำคัญกับ UTF-16 และ UTF-32"}, {"title": "Typography และหน่วย", "text": "Typography จัดอักษรให้อ่านง่ายและเหมาะสม Legibility เน้นแยกตัว Readability เน้นอ่านต่อเนื่อง 1 point=1/72 นิ้ว 1 pica=12 points ส่วน em สัมพันธ์กับขนาดตัวพิมพ์"}, {"title": "ระยะและเส้นอ้างอิง", "text": "Baseline คือเส้นฐาน x-height คือความสูง x พิมพ์เล็ก Leading คือระยะ Baseline สองบรรทัด Tracking ปรับช่องไฟทั้งช่วง Kerning ปรับเฉพาะคู่ เช่น AV"}, {"title": "ลักษณะ Typeface", "text": "Serif มีเชิง Sans-serif ไม่มีเชิง Monospace ทุกช่องกว้างเท่ากัน Proportional ต่างตามตัว Weight คือน้ำหนักเส้น Italic ออกแบบทรงเอียงเฉพาะ Oblique เอียงจากรูปปกติ Family รวมแบบที่เข้ากัน"}, {"title": "Font Technologies", "text": "Bitmap เก็บพิกเซลและอาจต้องหลายชุดตามขนาด Outline เก็บเส้นและเส้นโค้งแล้ว Rasterize มี Width/Kerning Tables และ Hinting ช่วยความชัดขนาดเล็ก รูปแบบสำคัญคือ TrueType, OpenType, WOFF/WOFF2 ต้องดู License ก่อนใช้และแจกจ่าย"}]}, {"n": 10, "title": "Hypermedia & Web", "sections": [{"title": "Hypertext และ Hypermedia", "text": "Hypertext เชื่อมข้อความให้เลือกเส้นทางอ่านแบบ Nonlinear Hypermedia ขยายสู่ภาพ เสียง วิดีโอ และสื่อโต้ตอบ Multimedia เน้นรวมหลายสื่อ ส่วน Hypermedia เพิ่มความเชื่อมโยง ตัวอย่างบทเรียนที่คลิกศัพท์เพื่อฟังเสียงและดูวิดีโอ"}, {"title": "MEMEX", "text": "Vannevar Bush เสนอปี 1945 ให้เก็บ ค้นคืน ใส่คำอธิบาย และเชื่อมเอกสารตามความสัมพันธ์ คล้ายแนวคิด Hyperlink และเส้นทางติดตามเนื้อหาในเว็บ"}, {"title": "องค์ประกอบเว็บ", "text": "HTML กำหนดโครงสร้าง HTTP รับส่งข้อมูล URL ระบุตำแหน่ง DOM แทนเอกสารในหน่วยความจำ Browser ส่งคำขอ รับ HTML แล้วสร้างโครงสร้างสำหรับแสดงผล"}, {"title": "Markup", "text": "Procedural เน้นคำสั่งการจัดแสดง Descriptive เน้นประเภทและโครงสร้าง HTML มี Element ระบุด้วย Tag และ Attribute เช่น href ในลิงก์ HTML ปัจจุบันมีมาตรฐานของตน ไม่ใช้กฎ SGML แบบเดิมทั้งหมด"}, {"title": "HTML CSS JavaScript", "text": "HTML บอกว่ามีอะไร CSS บอกหน้าตา JavaScript เพิ่มพฤติกรรม เช่นปุ่มเล่นเสียง HTML สร้างปุ่ม CSS แต่งปุ่ม JavaScript รับคลิกแล้วสั่งเล่น"}, {"title": "DOM และ DOM API", "text": "DOM เป็นต้นไม้ของวัตถุเอกสาร มี Element และ Text Nodes ส่วน DOM API เป็นช่องทางให้ JavaScript ค้นหา เพิ่ม ลบ หรือแก้ไข เช่น document.getElementById และ textContent"}, {"title": "Browser Rendering", "text": "Parse HTML → DOM → ประมวลผล Style → Layout → Paint → Composite งาน JavaScript หนักบน Main Thread ทำให้หน้าไม่ตอบสนอง การแก้ DOM/Style อาจทำให้ต้องคำนวณบางขั้นใหม่"}, {"title": "Web Worker", "text": "รัน JavaScript บน Thread แยกสำหรับงานหนัก เช่นวิเคราะห์เสียง ส่งผลกลับด้วย postMessage ให้ Main Thread อัปเดตหน้า Worker ทั่วไปไม่แก้ DOM ของหน้าโดยตรง มีต้นทุนรับส่งข้อมูลจึงไม่ได้ทำให้ทุกงานเร็วขึ้น"}, {"title": "Multimedia APIs", "text": "Canvas วาดและประมวลผลภาพ WebGL ใช้ GPU เรนเดอร์ WebXR รองรับ AR/VR WebSocket สื่อสารสองทาง SSE ส่งเหตุการณ์จาก Server ส่วน localStorage เก็บข้าม Session และ sessionStorage ผูกกับ Page Session"}, {"title": "WCMS", "text": "ระบบสร้าง แก้ไข และเผยแพร่เว็บ CMA เป็นเครื่องมือผู้เขียน CDA จัดเตรียมและส่งเนื้อหา มี WYSIWYG, Templates, Versioning, หลายภาษา, Workflow และ Access Control เช่น WordPress และ Drupal"}]}, {"n": 11, "title": "Streaming & Security", "sections": [{"title": "ประเภทและ Real-time", "text": "Interactive เช่น Video Call ต้องหน่วงต่ำ Streaming เช่นดูหนังยอม Buffer ได้มากกว่า Live ส่งเหตุการณ์กำลังเกิด On-demand เล่นสิ่งบันทึกแล้ว Real-time หมายถึงเสร็จทัน Deadline ไม่ใช่เร็วเฉลี่ยอย่างเดียว"}, {"title": "Hard, Firm, Soft", "text": "Hard พลาด Deadline ไม่ได้ Firm พลาดบางครั้งได้แต่ผลที่ช้าอาจไร้ประโยชน์ Soft ผลช้ายังมีประโยชน์แต่คุณภาพลดลง เฟรมวิดีโอที่มาช้าอาจต้องทิ้ง"}, {"title": "คุณภาพเครือข่าย", "text": "Bandwidth คือความจุ Throughput คืออัตราจริง Latency คือเวลาหน่วง Jitter คือความแปรปรวน Packet Loss คือข้อมูลสูญหาย Buffer รับความผันผวนได้แต่เพิ่มเวลารอและความหน่วง"}, {"title": "Transport", "text": "TCP เชื่อถือได้และรักษาลำดับ UDP ไม่รับประกันในตัว QUIC ทำงานบน UDP แต่เพิ่มความเชื่อถือได้ หลาย Streams และความปลอดภัย RTP ส่งสื่อพร้อม Timestamp/Sequence ส่วน RTCP รายงานคุณภาพ"}, {"title": "Progressive Download", "text": "ดาวน์โหลดไฟล์และเริ่มเล่นก่อนครบผ่าน HTTP MP4 ควรวาง moov atom ที่มีข้อมูลสำหรับอ่านและเล่นไว้ต้นไฟล์เพื่อเริ่มเร็ว แบบไฟล์เดียวไม่ได้มี ABR ในตัว"}, {"title": "RTSP และ RTMP", "text": "RTSP ควบคุม Session เช่น PLAY/PAUSE โดยมักส่งสื่อด้วย RTP ใช้กับกล้อง IP ส่วน RTMP พบมากใน Ingest เช่น OBS ส่ง Live เข้าแพลตฟอร์ม RTMPS เพิ่ม TLS Protocol ขาเข้าและขาออกอาจต่างกัน"}, {"title": "HLS และ DASH", "text": "แบ่งสื่อเป็น Segments และมี Manifest HLS ใช้ M3U8 พัฒนาโดย Apple DASH ใช้ MPD แบบ XML จาก MPEG ทั้งคู่ส่งผ่าน HTTP และรองรับ Adaptive Bitrate Segment พบทั้ง TS และ Fragmented MP4 ตามระบบ"}, {"title": "Adaptive Bitrate", "text": "เตรียมหลาย Representation ผู้เล่นเลือกตาม Throughput และ Buffer เครือข่ายดีเพิ่มคุณภาพ เครือข่ายแย่ลด Bitrate เพื่อไม่ให้หยุดรอ เปลี่ยนตาม Segment ที่จัดเวลาให้สอดคล้องกัน"}, {"title": "Streaming Pipeline", "text": "กล้อง → Encoder → Ingest → Transcoding → Packaging → CDN → Player Transcoding เข้ารหัสใหม่ Packaging จัด Container/Segment/Manifest ไม่จำเป็นต้องเข้ารหัสใหม่"}, {"title": "CDN", "text": "กระจาย Server และ Cache เนื้อหา ช่วยลดภาระ Origin รองรับผู้ชมมาก และปรับเส้นทางส่งข้อมูล CDN ช่วยส่ง ส่วน ABR ช่วยเลือกระดับข้อมูล ทั้งคู่สนับสนุนกัน"} const essays=[{title:'Sound / Audio',q:'อธิบายการบันทึกเสียงเป็นดิจิทัล ปัจจัยคุณภาพ และเปรียบเทียบ Lossless กับ Lossy',keys:['ไมโครโฟนและ Gain','Sampling กับ Quantization','Sampling Rate ต่างจาก Bit Depth','Clipping กับ Dither','Lossless / Lossy และ Masking'],answer:'ไมโครโฟนแปลงความดันเสียงเป็นไฟฟ้า ตั้ง Gain ไม่ให้เกินช่วงรับและเผื่อ Headroom จากนั้นจำกัดความถี่ก่อน ADC ทำ Sampling ตามเวลาและ Quantization ตามระดับ Sampling Rate กำหนดจำนวนตัวอย่าง ส่วน Bit Depth กำหนดจำนวนระดับ Clipping ทำให้ยอดคลื่นถูกตัด Dither ใช้จัดการความเพี้ยน Quantization โดยเฉพาะเมื่อลด Bit Depth ไม่ได้ซ่อม Clipping เมื่อบีบอัด Lossless เช่น FLAC สามารถคืนต้นฉบับครบ ส่วน Lossy เช่น AAC ใช้ Threshold of Hearing และ Masking ลดข้อมูลที่รับรู้ได้น้อย แต่คืนข้อมูลทั้งหมดไม่ได้'}, {title:'Hypermedia',q:'อธิบาย Hypermedia และความสัมพันธ์ของ HTML, CSS, JavaScript, DOM และ Web Worker',keys:['Nonlinear และการเชื่อมหลายสื่อ','HTML / CSS / JavaScript','DOM ต่างจาก DOM API','Main Thread','Worker และข้อจำกัด DOM'],answer:'Hypermedia เชื่อมข้อความ ภาพ เสียง และวิดีโอให้ผู้ใช้เลือกเส้นทางแบบ Nonlinear เช่นบทเรียนเลือกหัวข้อ HTML กำหนดโครงสร้าง CSS กำหนดการแสดง JavaScript เพิ่มพฤติกรรม Browser สร้าง DOM เป็นโครงสร้างในหน่วยความจำ และ JavaScript ใช้ DOM API เปลี่ยนเนื้อหา งานคำนวณหนักบน Main Thread อาจทำให้หน้าไม่ตอบสนอง จึงย้ายงานที่เหมาะสมไป Worker แล้วส่งผลกลับผ่าน Message ให้ Main Thread อัปเดตหน้า Worker ทั่วไปไม่เข้าถึง DOM โดยตรง'}, {title:'Streaming',q:'อธิบายระบบ Live แบบ Adaptive Bitrate เปรียบเทียบ HLS/DASH และบทบาท CDN',keys:['Encoder และ Ingest','Transcoding / Packaging','Segments และ Manifest','HLS M3U8 / DASH MPD','ABR, Buffer และ CDN'],answer:'กล้องส่งภาพเข้า Encoder แล้ว Ingest เข้าระบบ เช่น RTMP จากนั้น Transcode เป็นหลายคุณภาพ และ Package เป็น Segments พร้อม Manifest HLS ใช้ M3U8 ส่วน DASH ใช้ MPD แบบ XML ทั้งคู่ส่งผ่าน HTTP Player ประเมิน Throughput กับ Buffer เพื่อเลือก Bitrate ลดคุณภาพเมื่อเครือข่ายช้าเพื่อไม่ให้หยุดเล่น CDN กระจายและ Cache เนื้อหา ลดภาระ Origin และรองรับผู้ชมจำนวนมาก Buffer ช่วยรับความผันผวนแต่เพิ่มความหน่วง'}, {title:'โจทย์เชื่อมโยง',q:'ออกแบบเว็บเรียนออนไลน์ที่เลือกหัวข้อได้ มีเสียงและวิดีโอ และรองรับเครือข่ายหลายระดับ',keys:['Hypermedia และเส้นทางเรียน','HTML/CSS/JS และ DOM','คุณภาพเสียงและ Codec','HLS/DASH กับ ABR','CDN และ HTTPS'],answer:'จัดเนื้อหาแบบ Hypermedia ให้ผู้เรียนเลือกและเชื่อมหัวข้อ ใช้ HTML วางโครงสร้าง CSS จัดหน้า JavaScript ควบคุมผ่าน DOM API บันทึกเสียงโดยเลือก Sampling Rate/Bit Depth และ Gain เหมาะสม ใช้ Codec ตามเป้าหมายคุณภาพ ส่งวิดีโอด้วย HLS/DASH หลาย Bitrate เพื่อให้ ABR ปรับตามเครือข่าย ใช้ CDN รองรับผู้ชม และ HTTPS ป้องกันข้อมูลระหว่างส่ง งานประมวลผลหนักที่เหมาะสมย้ายไป Worker หากต้องจำกัดสิทธิ์เนื้อหาเพิ่ม DRM'}];
</script><script>const app=document.querySelector('#app'),nav=document.querySelector('#nav');let state={questions:[],answers:[],i:0,submitted:false};const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}let done=get('mm-done',[]);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function route(){let r=location.hash.slice(1)||'home';nav.innerHTML=`<a href="#home" class="${r==='home'?'active':''}">⌂ &nbsp; ภาพรวมการเรียน</a><div class="label">LEARN · อ่านเนื้อหา</div>`+chapters.map(c=>`<a class="chapter ${r==='ch'+c.n?'active':''}" href="#ch${c.n}">${c.n} &nbsp; ${c.title}</a>`).join('')+`<div class="label">PRACTICE · ฝึกทำข้อสอบ</div><a href="#quiz" class="${r==='quiz'?'active':''}">◉ &nbsp; แบบทดสอบปรนัย</a><a href="#essay" class="${r==='essay'?'active':''}">✎ &nbsp; ฝึกเขียนอัตนัย</a>`;if(r.startsWith('ch'))read(+r.slice(2));else if(r==='quiz')quizHome();else if(r==='essay')essay();else home();window.scrollTo(0,0)}function home(){app.innerHTML=`<div class="hero"><span class="tag">เตรียมสอบ · บทที่ 6–12</span><h1>ค่อย ๆ อ่าน<br>ให้ทุกเรื่องเชื่อมถึงกัน</h1><p>ห้องทบทวน Multimedia ของคุณ อ่านเนื้อหาเป็นบท<br>ทดสอบความเข้าใจ และฝึกเรียบเรียงคำตอบก่อนสอบ</p><button onclick="location.hash='ch6'">เริ่มอ่านบทที่ 6 &nbsp; ↗</button><div class="stats"><div><b>07</b><span>บทเรียน</span></div><div><b>52</b><span>ข้อปรนัยฝึกทำ</span></div><div><b>40</b><span>คะแนนสอบทั้งหมด</span></div></div></div><div class="row" style="justify-content:space-between;margin-top:30px"><h2>เส้นทางการอ่านของคุณ</h2><span class="pill">อ่านจบ ${done.length} / 7 บท</span></div><input type="search" id="search" placeholder="ค้นหาบทหรือคำสำคัญ…" aria-label="ค้นหาบทเรียน" style="width:100%"><div class="grid" id="cards"></div><div class="section"><span class="tag">EXAM FOCUS</span><h2>อัตนัย 2 ข้อ · รวม 14 คะแนน</h2><p>เน้น Sound/Audio, Hypermedia และ Streaming เตรียมตอบทั้งความหมาย กระบวนการ เหตุผล และตัวอย่าง ส่วนปรนัย 52 ข้อ รวม 26 คะแนน ครอบคลุมทั้ง 7 บท</p><a href="#essay">ไปฝึกอัตนัย →</a></div>`;cards('');document.querySelector('#search').oninput=e=>cards(e.target.value)}function cards(s){let list=chapters.filter(c=>(c.title+JSON.stringify(c.sections)).toLowerCase().includes(s.toLowerCase()));document.querySelector('#cards').innerHTML=list.length?list.map(c=>`<a class="card" href="#ch${c.n}"><div class="row" style="justify-content:space-between"><span class="number">CHAPTER ${String(c.n).padStart(2,'0')}</span><span>${done.includes(c.n)?'✓ อ่านแล้ว':'↗'}</span></div><h3>${c.title}</h3><p>${c.sections.slice(0,3).map(s=>s.title).join(' · ')}</p><span class="tag">${c.sections.length} หัวข้อ${[8,10,11].includes(c.n)?' · เน้นอัตนัย':''}</span></a>`).join(''):'<p>ไม่พบหัวข้อ ลองใช้คำค้นอื่น</p>'}function read(n){const c=chapters.find(c=>c.n===n);if(!c){location.hash='home';return}app.innerHTML=`<div class="reading"><span class="tag">CHAPTER ${n}</span><h1>${c.title}</h1><p class="muted">อ่านคำอธิบายทีละหัวข้อ แล้วใช้คำถามท้ายบททบทวนความเข้าใจ</p><div class="row"><button onclick="window.print()">พิมพ์บทนี้</button><button id="mark">${done.includes(n)?'✓ อ่านจบแล้ว':'ทำเครื่องหมายว่าอ่านจบ'}</button></div><div class="section toc">${c.sections.map((s,i)=>`<a href="#" onclick="event.preventDefault();document.getElementById('s${i}').scrollIntoView({behavior:'smooth'})">${i+1}. ${s.title}</a>`).join('')}</div>${c.sections.map((s,i)=>`<section class="section" id="s${i}"><span class="number">${String(i+1).padStart(2,'0')}</span><h2>${s.title}</h2><p>${safe(s.text)}</p></section>`).join('')}<div class="row"><button class="primary" onclick="location.hash='quiz'">ทดสอบความเข้าใจ →</button>${n<12?`<a href="#ch${n+1}">บทถัดไป →</a>`:''}</div></div>`;document.querySelector('#mark').onclick=()=>{done=done.includes(n)?done.filter(x=>x!==n):[...done,n];save('mm-done',done);read(n)}}function quizHome(){app.innerHTML=`<span class="tag">PRACTICE 01</span><h1>เช็กความเข้าใจ<br>ทีละคำถาม</h1><p class="muted">แนวฝึกที่จัดทำจากบทเรียน ไม่ใช่ข้อสอบจริง · ตอบก่อนแล้วตรวจเฉลยพร้อมเหตุผล</p><div class="section"><h2>เลือกชุดฝึก</h2><div class="row"><select id="filter" aria-label="เลือกบท"><option value="all">ทุกบท · 52 ข้อ</option>${chapters.map(c=>`<option value="${c.n}">บท ${c.n} ${c.title}</option>`).join('')}</select><button class="primary" onclick="startQuiz()">เริ่มทำแบบทดสอบ →</button></div><p class="muted">ชุดรวมคิดข้อละ 0.5 คะแนน รวม 26 คะแนน สามารถย้อนแก้คำตอบก่อนส่งได้</p></div><div id="quizarea"></div>`}function startQuiz(){let f=document.querySelector('#filter').value;state={questions:shuffle(bank.filter(q=>f==='all'||q[0]==f)).map(q=>({q,opts:shuffle(q.slice(2,6))})),answers:[],i:0,submitted:false};drawQ()}function drawQ(){const a=document.querySelector('#quizarea'),s=state,x=s.questions[s.i];a.innerHTML=`<div class="section"><div class="row" style="justify-content:space-between"><span class="tag">บท ${x.q[0]}</span><span>ข้อ ${s.i+1} / ${s.questions.length}</span></div><div class="progress"><div style="width:${(s.i+1)/s.questions.length*100}%"></div></div><h2>${x.q[1]}</h2>${x.opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${s.answers[s.i]===o?'checked':''}> ${safe(o)}</label>`).join('')}<div class="row"><button onclick="move(-1)" ${s.i===0?'disabled':''}>← ก่อนหน้า</button><button onclick="move(1)" ${s.i===s.questions.length-1?'disabled':''}>ถัดไป →</button><button class="primary" onclick="finish()">ส่งคำตอบทั้งหมด</button><span class="muted">ตอบแล้ว ${s.answers.filter(Boolean).length} ข้อ</span></div></div>`;a.querySelectorAll('input').forEach(el=>el.onchange=()=>{s.answers[s.i]=x.opts[+el.value];drawQ()})}function move(d){state.i+=d;drawQ()}function finish(){const s=state,missing=s.questions.length-s.answers.filter(Boolean).length;if(missing&&!confirm(`ยังไม่ได้ตอบ ${missing} ข้อ ต้องการส่งหรือไม่?`))return;let correct=s.questions.filter((x,i)=>s.answers[i]===x.q[2]).length;document.querySelector('#quizarea').innerHTML=`<div class="section"><span class="tag">ผลการฝึก</span><h2>${correct} / ${s.questions.length} ข้อ · ${correct*.5} / ${s.questions.length*.5} คะแนน</h2><p>ทบทวนเหตุผลด้านล่าง แล้วกลับไปอ่านหัวข้อที่ยังไม่แม่น</p><button onclick="startQuiz()">ลองใหม่อีกครั้ง</button></div>`+s.questions.map((x,i)=>`<div class="section"><span class="tag">ข้อ ${i+1} · บท ${x.q[0]}</span><h3>${x.q[1]}</h3><p>คำตอบของคุณ: ${safe(s.answers[i]||'ไม่ได้ตอบ')}</p><div class="feedback ${s.answers[i]===x.q[2]?'':'bad'}"><b>${s.answers[i]===x.q[2]?'✓ ถูกต้อง':'คำตอบที่ถูก: '+x.q[2]}</b><br>${x.q[6]}</div><a href="#ch${x.q[0]}">ทบทวนบทนี้ →</a></div>`).join('')}function essay(){app.innerHTML=`<span class="tag">PRACTICE 02</span><h1>ฝึกคิด แล้วเขียน<br>ด้วยความเข้าใจ</h1><p class="muted">ขอบเขตอัตนัย: Sound/Audio · Hypermedia · Streaming<br>ข้อสอบจริงมี 2 ข้อ รวม 14 คะแนน โจทย์ด้านล่างเป็นแนวฝึก</p><div class="feedback">โครงคำตอบ: ความหมาย → หลักการ → ขั้นตอน → เหตุผล → ตัวอย่าง<br>ประเมินตนเองจากเช็กลิสต์ ไม่มีการให้คะแนนอัตโนมัติ</div>${essays.map((e,i)=>`<section class="section"><span class="tag">${e.title}</span><h2>${e.q}</h2><label for="draft${i}">คำตอบของคุณ</label><textarea id="draft${i}" placeholder="ลองเขียนก่อนเปิดแนวคำตอบ…">${safe(get('mm-essay'+i,''))}</textarea><p class="muted" id="status${i}" style="font-size:12px">บันทึกร่างอัตโนมัติในเบราว์เซอร์นี้</p><details><summary>เปิดแนวคำตอบและเช็กลิสต์</summary><p>${e.answer}</p><h3>ตรวจคำตอบของตัวเอง</h3>${e.keys.map(k=>`<label style="display:block"><input type="checkbox"> ${k}</label>`).join('')}</details></section>`).join('')}`;essays.forEach((e,i)=>document.querySelector('#draft'+i).oninput=ev=>{save('mm-essay'+i,ev.target.value);document.querySelector('#status'+i).textContent='บันทึกร่างแล้ว · '+ev.target.value.length+' ตัวอักษร'})}window.addEventListener('hashchange',route);route();
</script></html>
