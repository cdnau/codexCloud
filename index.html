const essays=[{title:'Sound / Audio',q:'อธิบายการบันทึกเสียงเป็นดิจิทัล ปัจจัยคุณภาพ และเปรียบเทียบ Lossless กับ Lossy',keys:['ไมโครโฟนและ Gain','Sampling กับ Quantization','Sampling Rate ต่างจาก Bit Depth','Clipping กับ Dither','Lossless / Lossy และ Masking'],answer:'ไมโครโฟนแปลงความดันเสียงเป็นไฟฟ้า ตั้ง Gain ไม่ให้เกินช่วงรับและเผื่อ Headroom จากนั้นจำกัดความถี่ก่อน ADC ทำ Sampling ตามเวลาและ Quantization ตามระดับ Sampling Rate กำหนดจำนวนตัวอย่าง ส่วน Bit Depth กำหนดจำนวนระดับ Clipping ทำให้ยอดคลื่นถูกตัด Dither ใช้จัดการความเพี้ยน Quantization โดยเฉพาะเมื่อลด Bit Depth ไม่ได้ซ่อม Clipping เมื่อบีบอัด Lossless เช่น FLAC สามารถคืนต้นฉบับครบ ส่วน Lossy เช่น AAC ใช้ Threshold of Hearing และ Masking ลดข้อมูลที่รับรู้ได้น้อย แต่คืนข้อมูลทั้งหมดไม่ได้'}, {title:'Hypermedia',q:'อธิบาย Hypermedia และความสัมพันธ์ของ HTML, CSS, JavaScript, DOM และ Web Worker',keys:['Nonlinear และการเชื่อมหลายสื่อ','HTML / CSS / JavaScript','DOM ต่างจาก DOM API','Main Thread','Worker และข้อจำกัด DOM'],answer:'Hypermedia เชื่อมข้อความ ภาพ เสียง และวิดีโอให้ผู้ใช้เลือกเส้นทางแบบ Nonlinear เช่นบทเรียนเลือกหัวข้อ HTML กำหนดโครงสร้าง CSS กำหนดการแสดง JavaScript เพิ่มพฤติกรรม Browser สร้าง DOM เป็นโครงสร้างในหน่วยความจำ และ JavaScript ใช้ DOM API เปลี่ยนเนื้อหา งานคำนวณหนักบน Main Thread อาจทำให้หน้าไม่ตอบสนอง จึงย้ายงานที่เหมาะสมไป Worker แล้วส่งผลกลับผ่าน Message ให้ Main Thread อัปเดตหน้า Worker ทั่วไปไม่เข้าถึง DOM โดยตรง'}, {title:'Streaming',q:'อธิบายระบบ Live แบบ Adaptive Bitrate เปรียบเทียบ HLS/DASH และบทบาท CDN',keys:['Encoder และ Ingest','Transcoding / Packaging','Segments และ Manifest','HLS M3U8 / DASH MPD','ABR, Buffer และ CDN'],answer:'กล้องส่งภาพเข้า Encoder แล้ว Ingest เข้าระบบ เช่น RTMP จากนั้น Transcode เป็นหลายคุณภาพ และ Package เป็น Segments พร้อม Manifest HLS ใช้ M3U8 ส่วน DASH ใช้ MPD แบบ XML ทั้งคู่ส่งผ่าน HTTP Player ประเมิน Throughput กับ Buffer เพื่อเลือก Bitrate ลดคุณภาพเมื่อเครือข่ายช้าเพื่อไม่ให้หยุดเล่น CDN กระจายและ Cache เนื้อหา ลดภาระ Origin และรองรับผู้ชมจำนวนมาก Buffer ช่วยรับความผันผวนแต่เพิ่มความหน่วง'}, {title:'โจทย์เชื่อมโยง',q:'ออกแบบเว็บเรียนออนไลน์ที่เลือกหัวข้อได้ มีเสียงและวิดีโอ และรองรับเครือข่ายหลายระดับ',keys:['Hypermedia และเส้นทางเรียน','HTML/CSS/JS และ DOM','คุณภาพเสียงและ Codec','HLS/DASH กับ ABR','CDN และ HTTPS'],answer:'จัดเนื้อหาแบบ Hypermedia ให้ผู้เรียนเลือกและเชื่อมหัวข้อ ใช้ HTML วางโครงสร้าง CSS จัดหน้า JavaScript ควบคุมผ่าน DOM API บันทึกเสียงโดยเลือก Sampling Rate/Bit Depth และ Gain เหมาะสม ใช้ Codec ตามเป้าหมายคุณภาพ ส่งวิดีโอด้วย HLS/DASH หลาย Bitrate เพื่อให้ ABR ปรับตามเครือข่าย ใช้ CDN รองรับผู้ชม และ HTTPS ป้องกันข้อมูลระหว่างส่ง งานประมวลผลหนักที่เหมาะสมย้ายไป Worker หากต้องจำกัดสิทธิ์เนื้อหาเพิ่ม DRM'}];
</script><script>const app=document.querySelector('#app'),nav=document.querySelector('#nav');let state={questions:[],answers:[],i:0,submitted:false};const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}let done=get('mm-done',[]);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function route(){let r=location.hash.slice(1)||'home';nav.innerHTML=`<a href="#home" class="${r==='home'?'active':''}">⌂ &nbsp; ภาพรวมการเรียน</a><div class="label">LEARN · อ่านเนื้อหา</div>`+chapters.map(c=>`<a class="chapter ${r==='ch'+c.n?'active':''}" href="#ch${c.n}">${c.n} &nbsp; ${c.title}</a>`).join('')+`<div class="label">PRACTICE · ฝึกทำข้อสอบ</div><a href="#quiz" class="${r==='quiz'?'active':''}">◉ &nbsp; แบบทดสอบปรนัย</a><a href="#essay" class="${r==='essay'?'active':''}">✎ &nbsp; ฝึกเขียนอัตนัย</a>`;if(r.startsWith('ch'))read(+r.slice(2));else if(r==='quiz')quizHome();else if(r==='essay')essay();else home();window.scrollTo(0,0)}function home(){app.innerHTML=`<div class="hero"><span class="tag">เตรียมสอบ · บทที่ 6–12</span><h1>ค่อย ๆ อ่าน<br>ให้ทุกเรื่องเชื่อมถึงกัน</h1><p>ห้องทบทวน Multimedia ของคุณ อ่านเนื้อหาเป็นบท<br>ทดสอบความเข้าใจ และฝึกเรียบเรียงคำตอบก่อนสอบ</p><button onclick="location.hash='ch6'">เริ่มอ่านบทที่ 6 &nbsp; ↗</button><div class="stats"><div><b>07</b><span>บทเรียน</span></div><div><b>52</b><span>ข้อปรนัยฝึกทำ</span></div><div><b>40</b><span>คะแนนสอบทั้งหมด</span></div></div></div><div class="row" style="justify-content:space-between;margin-top:30px"><h2>เส้นทางการอ่านของคุณ</h2><span class="pill">อ่านจบ ${done.length} / 7 บท</span></div><input type="search" id="search" placeholder="ค้นหาบทหรือคำสำคัญ…" aria-label="ค้นหาบทเรียน" style="width:100%"><div class="grid" id="cards"></div><div class="section"><span class="tag">EXAM FOCUS</span><h2>อัตนัย 2 ข้อ · รวม 14 คะแนน</h2><p>เน้น Sound/Audio, Hypermedia และ Streaming เตรียมตอบทั้งความหมาย กระบวนการ เหตุผล และตัวอย่าง ส่วนปรนัย 52 ข้อ รวม 26 คะแนน ครอบคลุมทั้ง 7 บท</p><a href="#essay">ไปฝึกอัตนัย →</a></div>`;cards('');document.querySelector('#search').oninput=e=>cards(e.target.value)}function cards(s){let list=chapters.filter(c=>(c.title+JSON.stringify(c.sections)).toLowerCase().includes(s.toLowerCase()));document.querySelector('#cards').innerHTML=list.length?list.map(c=>`<a class="card" href="#ch${c.n}"><div class="row" style="justify-content:space-between"><span class="number">CHAPTER ${String(c.n).padStart(2,'0')}</span><span>${done.includes(c.n)?'✓ อ่านแล้ว':'↗'}</span></div><h3>${c.title}</h3><p>${c.sections.slice(0,3).map(s=>s.title).join(' · ')}</p><span class="tag">${c.sections.length} หัวข้อ${[8,10,11].includes(c.n)?' · เน้นอัตนัย':''}</span></a>`).join(''):'<p>ไม่พบหัวข้อ ลองใช้คำค้นอื่น</p>'}function read(n){const c=chapters.find(c=>c.n===n);if(!c){location.hash='home';return}app.innerHTML=`<div class="reading"><span class="tag">CHAPTER ${n}</span><h1>${c.title}</h1><p class="muted">อ่านคำอธิบายทีละหัวข้อ แล้วใช้คำถามท้ายบททบทวนความเข้าใจ</p><div class="row"><button onclick="window.print()">พิมพ์บทนี้</button><button id="mark">${done.includes(n)?'✓ อ่านจบแล้ว':'ทำเครื่องหมายว่าอ่านจบ'}</button></div><div class="section toc">${c.sections.map((s,i)=>`<a href="#" onclick="event.preventDefault();document.getElementById('s${i}').scrollIntoView({behavior:'smooth'})">${i+1}. ${s.title}</a>`).join('')}</div>${c.sections.map((s,i)=>`<section class="section" id="s${i}"><span class="number">${String(i+1).padStart(2,'0')}</span><h2>${s.title}</h2><p>${safe(s.text)}</p></section>`).join('')}<div class="row"><button class="primary" onclick="location.hash='quiz'">ทดสอบความเข้าใจ →</button>${n<12?`<a href="#ch${n+1}">บทถัดไป →</a>`:''}</div></div>`;document.querySelector('#mark').onclick=()=>{done=done.includes(n)?done.filter(x=>x!==n):[...done,n];save('mm-done',done);read(n)}}function quizHome(){app.innerHTML=`<span class="tag">PRACTICE 01</span><h1>เช็กความเข้าใจ<br>ทีละคำถาม</h1><p class="muted">แนวฝึกที่จัดทำจากบทเรียน ไม่ใช่ข้อสอบจริง · ตอบก่อนแล้วตรวจเฉลยพร้อมเหตุผล</p><div class="section"><h2>เลือกชุดฝึก</h2><div class="row"><select id="filter" aria-label="เลือกบท"><option value="all">ทุกบท · 52 ข้อ</option>${chapters.map(c=>`<option value="${c.n}">บท ${c.n} ${c.title}</option>`).join('')}</select><button class="primary" onclick="startQuiz()">เริ่มทำแบบทดสอบ →</button></div><p class="muted">ชุดรวมคิดข้อละ 0.5 คะแนน รวม 26 คะแนน สามารถย้อนแก้คำตอบก่อนส่งได้</p></div><div id="quizarea"></div>`}function startQuiz(){let f=document.querySelector('#filter').value;state={questions:shuffle(bank.filter(q=>f==='all'||q[0]==f)).map(q=>({q,opts:shuffle(q.slice(2,6))})),answers:[],i:0,submitted:false};drawQ()}function drawQ(){const a=document.querySelector('#quizarea'),s=state,x=s.questions[s.i];a.innerHTML=`<div class="section"><div class="row" style="justify-content:space-between"><span class="tag">บท ${x.q[0]}</span><span>ข้อ ${s.i+1} / ${s.questions.length}</span></div><div class="progress"><div style="width:${(s.i+1)/s.questions.length*100}%"></div></div><h2>${x.q[1]}</h2>${x.opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${s.answers[s.i]===o?'checked':''}> ${safe(o)}</label>`).join('')}<div class="row"><button onclick="move(-1)" ${s.i===0?'disabled':''}>← ก่อนหน้า</button><button onclick="move(1)" ${s.i===s.questions.length-1?'disabled':''}>ถัดไป →</button><button class="primary" onclick="finish()">ส่งคำตอบทั้งหมด</button><span class="muted">ตอบแล้ว ${s.answers.filter(Boolean).length} ข้อ</span></div></div>`;a.querySelectorAll('input').forEach(el=>el.onchange=()=>{s.answers[s.i]=x.opts[+el.value];drawQ()})}function move(d){state.i+=d;drawQ()}function finish(){const s=state,missing=s.questions.length-s.answers.filter(Boolean).length;if(missing&&!confirm(`ยังไม่ได้ตอบ ${missing} ข้อ ต้องการส่งหรือไม่?`))return;let correct=s.questions.filter((x,i)=>s.answers[i]===x.q[2]).length;document.querySelector('#quizarea').innerHTML=`<div class="section"><span class="tag">ผลการฝึก</span><h2>${correct} / ${s.questions.length} ข้อ · ${correct*.5} / ${s.questions.length*.5} คะแนน</h2><p>ทบทวนเหตุผลด้านล่าง แล้วกลับไปอ่านหัวข้อที่ยังไม่แม่น</p><button onclick="startQuiz()">ลองใหม่อีกครั้ง</button></div>`+s.questions.map((x,i)=>`<div class="section"><span class="tag">ข้อ ${i+1} · บท ${x.q[0]}</span><h3>${x.q[1]}</h3><p>คำตอบของคุณ: ${safe(s.answers[i]||'ไม่ได้ตอบ')}</p><div class="feedback ${s.answers[i]===x.q[2]?'':'bad'}"><b>${s.answers[i]===x.q[2]?'✓ ถูกต้อง':'คำตอบที่ถูก: '+x.q[2]}</b><br>${x.q[6]}</div><a href="#ch${x.q[0]}">ทบทวนบทนี้ →</a></div>`).join('')}function essay(){app.innerHTML=`<span class="tag">PRACTICE 02</span><h1>ฝึกคิด แล้วเขียน<br>ด้วยความเข้าใจ</h1><p class="muted">ขอบเขตอัตนัย: Sound/Audio · Hypermedia · Streaming<br>ข้อสอบจริงมี 2 ข้อ รวม 14 คะแนน โจทย์ด้านล่างเป็นแนวฝึก</p><div class="feedback">โครงคำตอบ: ความหมาย → หลักการ → ขั้นตอน → เหตุผล → ตัวอย่าง<br>ประเมินตนเองจากเช็กลิสต์ ไม่มีการให้คะแนนอัตโนมัติ</div>${essays.map((e,i)=>`<section class="section"><span class="tag">${e.title}</span><h2>${e.q}</h2><label for="draft${i}">คำตอบของคุณ</label><textarea id="draft${i}" placeholder="ลองเขียนก่อนเปิดแนวคำตอบ…">${safe(get('mm-essay'+i,''))}</textarea><p class="muted" id="status${i}" style="font-size:12px">บันทึกร่างอัตโนมัติในเบราว์เซอร์นี้</p><details><summary>เปิดแนวคำตอบและเช็กลิสต์</summary><p>${e.answer}</p><h3>ตรวจคำตอบของตัวเอง</h3>${e.keys.map(k=>`<label style="display:block"><input type="checkbox"> ${k}</label>`).join('')}</details></section>`).join('')}`;essays.forEach((e,i)=>document.querySelector('#draft'+i).oninput=ev=>{save('mm-essay'+i,ev.target.value);document.querySelector('#status'+i).textContent='บันทึกร่างแล้ว · '+ev.target.value.length+' ตัวอักษร'})}window.addEventListener('hashchange',route);route();
</script><style>:root{color-scheme:dark;--bg:#111719;--ink:#d5ded9;--muted:#a1b0aa;--line:#35433f;--accent:#b8d995}body{background:var(--bg);font-size:17px}aside{background:#151e20}button,input[type=search],select,textarea{background:#1c292b;color:var(--ink)}.card,.section{background:#192326}.card:hover,button:hover,nav a:hover{background:#233330}.active,.primary{background:#345745!important;color:#eff7ec!important}.tag,.pill{background:#293d33;color:#c9dfba}.hero{background:#1c322d;color:#e2ebdf;border:1px solid #3b5549}.hero button{color:#17271c}.feedback{background:#20382d;color:#d8e5d8}.bad{background:#422d2c;color:#efd4cc}.option:has(input:checked){background:#304531;border-color:#a2bd7b}.reading{max-width:900px}.reading p,.bullet{font-size:var(--reader-size,18px);line-height:2.1;color:#cbd6d0}.reading h2{margin:48px 0 18px;padding-top:20px;border-top:1px solid var(--line);color:#e1ebdf;scroll-margin-top:20px}.tablewrap{overflow-x:auto;margin:24px 0}table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}th,td{border:1px solid #3b4d46;text-align:left;padding:13px 16px;vertical-align:top}th{background:#263b32;color:#d7e9c5}tr:nth-child(even){background:#1c2b29}pre,.equation{padding:20px;background:#101b1d;border:1px solid var(--line);border-radius:10px;overflow:auto;color:#d6e7be}figure{margin:28px 0;padding:18px;background:#142225;border:1px solid #38504a;border-radius:14px}figure svg{width:100%;height:auto;display:block}figcaption{font-size:14px;color:#afc1b5;margin-top:14px}.reading details{padding:20px;background:#1c292b;border-radius:12px}.reading .toc a{display:block}.bullet{padding-left:15px;margin:6px 0}::selection{background:#42624a;color:#fff}@media(max-width:800px){.reading p,.bullet{font-size:var(--reader-size,17px)}nav .chapter{display:block}.section{padding:20px 16px}}@media print{body,.section,aside,figure{background:white!important;color:black!important}.reading p,.bullet{color:black}th,td{color:black}.readercontrols{display:none}}</style><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},startup:{typeset:true}};</script><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><script>const fullChapters={"6": {"title": "2D & 3D Graphics", "html": "<p>อ้างอิง: เอกสาร 2D &amp; 3D Graphics โดยเฉพาะหน้า 6–24, 26–47 และ 49–94</p>\n<h2>1. Bitmap กับ Vector ต่างกันอย่างไร</h2>\n<p>ภาพแบบ Bitmap หรือ Raster เก็บภาพเป็นตารางของจุดภาพหรือ Pixel แต่ละจุดมีค่าสีของตนเอง เมื่อรวมพิกเซลจำนวนมากจึงเกิดเป็นภาพ เช่น ภาพถ่ายจากกล้อง</p>\n<p>ภาพแบบ Vector เก็บคำอธิบายของรูปทรงเรขาคณิต เช่น เส้นตรง วงกลม รูปสี่เหลี่ยม และเส้นโค้ง โดยระบุตำแหน่ง ขนาด สี และคุณสมบัติอื่นด้วยตัวเลขหรือสมการ</p>\n<p>ตัวอย่างการเก็บวงกลมแบบ Vector คือ ระบุจุดศูนย์กลาง \\((x_0,y_0)\\) รัศมี \\(r\\) และสี โดยไม่จำเป็นต้องเก็บค่าสีของทุกพิกเซลไว้ล่วงหน้า</p>\n<div class=\"tablewrap\"><table><tr><th>ประเด็น</th><th>Bitmap</th><th>Vector</th></tr><tr><td>สิ่งที่จัดเก็บ</td><td>ค่าสีของแต่ละพิกเซล</td><td>รูปทรงและพารามิเตอร์</td></tr><tr><td>การขยาย</td><td>อาจเห็นพิกเซลหรือภาพเบลอ</td><td>คำนวณวาดใหม่ตามขนาดได้</td></tr><tr><td>งานที่เหมาะ</td><td>ภาพถ่าย ฉากธรรมชาติ พื้นผิวซับซ้อน</td><td>โลโก้ ไอคอน แผนภาพ ตัวอักษร</td></tr><tr><td>การแก้ไข</td><td>แก้ค่าสีของพิกเซล</td><td>แก้รูปทรงหรือคุณสมบัติของวัตถุ</td></tr><tr><td>ขนาดไฟล์</td><td>ขึ้นกับจำนวนพิกเซลและการบีบอัด</td><td>ขึ้นกับจำนวนและความซับซ้อนของวัตถุ</td></tr></table></div>\n<p>เหตุใด Vector จึงเหมาะกับโลโก้</p>\n<p>โลโก้มักประกอบด้วยรูปทรงไม่กี่ชิ้น จึงอธิบายด้วยข้อมูลจำนวนน้อยได้ และสามารถนำคำอธิบายเดิมไปวาดใหม่ที่ความละเอียดสูงขึ้นเมื่อขยายภาพ</p>\n<p>อย่างไรก็ตาม Vector ไม่ได้มีไฟล์เล็กกว่า Bitmap เสมอไป หากต้องใช้รูปทรงจำนวนมหาศาลเพื่อเลียนแบบภาพถ่าย ไฟล์อาจใหญ่และประมวลผลยากกว่าการใช้ Bitmap</p>\n<h2>2. ระบบพิกัด Point และ Vector</h2>\n<p>ระบบพิกัดทำให้คอมพิวเตอร์แทนตำแหน่งและรูปร่างด้วยตัวเลขได้</p>\n<div class=\"bullet\">• Point คือจุดหรือตำแหน่ง เช่น \\((2,5)\\)</div>\n<div class=\"bullet\">• Vector บอกการกระจัด มีทั้งขนาดและทิศทาง</div>\n<p>หากจุดเริ่มต้นคือ \\(A=(1,2)\\) และจุดปลายคือ \\(B=(4,6)\\)</p>\n<div class=\"equation\">\\[\\vec{AB}=B-A=(3,4)\\]</div>\n<p>ความยาวของเวกเตอร์คือ</p>\n<div class=\"equation\">\\[|\\vec{AB}|=\\sqrt{3^2+4^2}=5\\]</div>\n<p>จุดกับเวกเตอร์จึงมีความหมายต่างกัน แม้จะเขียนเป็นคู่ตัวเลขเหมือนกันได้: จุดใช้ระบุตำแหน่ง ส่วนเวกเตอร์ใช้ระบุการกระจัดหรือทิศทาง</p>\n<p>ในระบบพิกัดหน้าจอที่ใช้กันทั่วไป จุด \\((0,0)\\) อยู่มุมซ้ายบน ค่า \\(x\\) เพิ่มไปทางขวา และค่า \\(y\\) เพิ่มลงด้านล่าง ซึ่งต่างจากกราฟคณิตศาสตร์ที่มักให้ \\(y\\) เพิ่มขึ้นด้านบน</p>\n<h2>3. Modeling และ Rendering</h2>\n<p>Modeling คือการกำหนดว่าวัตถุมีรูปร่างอย่างไร เช่น วงกลมมีจุดศูนย์กลางและรัศมีเท่าใด</p>\n<p>Rendering คือการนำข้อมูลวัตถุมาสร้างเป็นภาพที่แสดงผลได้</p>\n<p>แม้ข้อมูลต้นฉบับจะเป็น Vector แต่เมื่อแสดงบนจอภาพที่เป็นตารางพิกเซล จะต้องผ่านการแปลงให้เป็นพิกเซล เรียกว่า Rasterization</p>\n<p>ตัวอย่างเช่น เส้นตรงทางคณิตศาสตร์อาจผ่านระหว่างตำแหน่งพิกเซล ระบบจึงต้องเลือกว่าพิกเซลใดควรถูกระบายสีเพื่อให้ภาพใกล้เคียงเส้นนั้น</p>\n<h2>4. Curve และ Bézier Curve</h2>\n<p>เส้นโค้งสำคัญต่อการออกแบบ เพราะรูปทรงในงานจริงไม่ได้มีเฉพาะเส้นตรง เช่น ตัวอักษร ตัวถังรถ รูปร่างตัวละคร และเส้นทางการเคลื่อนที่</p>\n<p>เส้นโค้งที่เหมาะกับงานออกแบบควรมีสองลักษณะหลัก คือ</p>\n<p>1. มีความเรียบต่อเนื่องตามต้องการ</p>\n<p>2. ควบคุมรูปร่างได้สะดวก</p>\n<p>Bézier Curve ใช้จุดควบคุมหรือ Control Points กำหนดรูปร่างของเส้น</p>\n<div class=\"tablewrap\"><table><tr><th>ชนิด</th><th>จำนวนจุดควบคุม</th><th>ลักษณะ</th></tr><tr><td>Linear Bézier</td><td>2 จุด</td><td>เส้นตรง</td></tr><tr><td>Quadratic Bézier</td><td>3 จุด</td><td>เส้นโค้งดีกรี 2</td></tr><tr><td>Cubic Bézier</td><td>4 จุด</td><td>เส้นโค้งดีกรี 3 นิยมใช้มาก</td></tr></table></div>\n<p>Linear Bézier มีสมการ</p>\n<div class=\"equation\">\\[P(t)=(1-t)P_0+tP_1,\\quad 0\\le t\\le1\\]</div>\n<div class=\"bullet\">• \\(t=0\\) ได้จุดเริ่มต้น \\(P_0\\)</div>\n<div class=\"bullet\">• \\(t=1\\) ได้จุดปลาย \\(P_1\\)</div>\n<div class=\"bullet\">• \\(t=0.5\\) ได้จุดกึ่งกลางระหว่างสองจุด</div>\n<p>Cubic Bézier มีสมการ</p>\n<div class=\"equation\">\\[P(t)=(1-t)^3P_0+3(1-t)^2tP_1+3(1-t)t^2P_2+t^3P_3\\]</div>\n<p>สิ่งที่ควรเข้าใจมากกว่าการท่องสูตรคือ</p>\n<div class=\"bullet\">• \\(P_0\\) และ \\(P_3\\) เป็นจุดเริ่มต้นและจุดปลาย</div>\n<div class=\"bullet\">• \\(P_1\\) และ \\(P_2\\) ใช้ควบคุมทิศทางและความโค้ง</div>\n<div class=\"bullet\">• เส้นไม่จำเป็นต้องผ่านจุดควบคุมภายใน</div>\n<div class=\"bullet\">• ทิศทางใกล้จุดเริ่มสัมพันธ์กับ \\(P_1-P_0\\)</div>\n<div class=\"bullet\">• ทิศทางใกล้จุดปลายสัมพันธ์กับ \\(P_3-P_2\\)</div>\n<p>สามารถต่อ Bézier หลายช่วงเพื่อสร้างเส้นซับซ้อน หรือปิดเส้นให้เป็นรูปร่างได้ ความเรียบตรงรอยต่อขึ้นกับระดับ Continuity ซึ่งจะขยายในบท Animation</p>\n<h2>5. คุณสมบัติของวัตถุกราฟิก</h2>\n<p>คุณสมบัติสำคัญแบ่งเป็นสองกลุ่ม</p>\n<p>Stroke หรือ Border คือเส้นขอบ เช่น สี ความหนา เส้นประ รูปแบบปลายเส้น และรูปแบบมุมต่อ</p>\n<p>Fill หรือ Face คือพื้นที่ด้านใน เช่น สีพื้น ความโปร่งใส การไล่สีหรือ Gradient และลวดลายหรือ Texture</p>\n<p>ดังนั้นวงกลมสองวงที่มีรูปร่างเหมือนกัน อาจดูต่างกันได้จาก Stroke และ Fill</p>\n<h2>6. การแปลงรูปทรง หรือ Transformation</h2>\n<p>Affine Transformation เป็นการแปลงที่ยังรักษาเส้นตรงและความขนานไว้ เช่น</p>\n<div class=\"bullet\">• Translation: เลื่อนตำแหน่ง</div>\n<div class=\"bullet\">• Rotation: หมุน</div>\n<div class=\"bullet\">• Scaling: ย่อหรือขยาย</div>\n<div class=\"bullet\">• Reflection: สะท้อน</div>\n<div class=\"bullet\">• Shearing: เฉือนให้เอียง</div>\n<p>Affine รักษาอัตราส่วนของระยะบนแนวเส้นตรงเดียวกัน แต่ ไม่จำเป็นต้องรักษามุมหรือความยาว เช่น การยืดเฉพาะแนวนอนทำให้วงกลมกลายเป็นวงรี</p>\n<p>Non-affine Transformation เช่น Perspective หรือ Projective Transformation สามารถทำให้เส้นที่เดิมขนานกันปรากฏลู่เข้าหากันได้ เหมือนรางรถไฟในภาพถ่าย</p>\n<h2>7. Boolean Operations</h2>\n<p>เป็นการสร้างรูปทรงใหม่จากพื้นที่ของวัตถุเดิม</p>\n<div class=\"tablewrap\"><table><tr><th>Operation</th><th>ผลลัพธ์</th></tr><tr><td>AND / Intersection</td><td>เก็บเฉพาะส่วนที่ทับซ้อน</td></tr><tr><td>OR / Union</td><td>รวมพื้นที่ของทั้งสองรูป</td></tr><tr><td>Difference \\(A-B\\)</td><td>เก็บ A โดยตัดส่วนที่ทับกับ B ออก</td></tr><tr><td>XOR</td><td>เก็บพื้นที่ของทั้งสองรูป แต่เอาส่วนทับซ้อนออก</td></tr></table></div>\n<p>ข้อควรจำคือ Difference มีลำดับ โดยทั่วไป \\(A-B\\) กับ \\(B-A\\) ให้ผลต่างกัน</p>\n<h2>8. การสร้างโมเดล 3D</h2>\n<p>กราฟิก 3D ใช้พิกัด \\((x,y,z)\\) เพื่อระบุตำแหน่งในสามมิติ</p>\n<p>วิธีสร้างโมเดลหลักในสไลด์ ได้แก่</p>\n<p>สร้างจาก 3D Primitives</p>\n<p>ใช้รูปทรงพื้นฐาน เช่น กล่อง ทรงกลม ทรงกระบอก และกรวย นำมาย่อ ขยาย หมุน และประกอบกัน หรือใช้ Boolean Operations</p>\n<p>ตัวอย่าง: สร้างแก้วจากทรงกระบอกใหญ่ แล้วลบทรงกระบอกเล็กออกเพื่อให้เกิดช่องด้านใน</p>\n<p>สร้างจากรูปทรง 2D</p>\n<div class=\"bullet\">• Extrusion: ยืดหน้าตัด 2D ให้มีความลึก เช่น ยืดรูปดาวให้กลายเป็นดาวสามมิติ</div>\n<div class=\"bullet\">• Lathe / Lathing: หมุนเส้นหน้าตัดรอบแกน เช่น สร้างแจกัน ขวด หรือแก้วทรงสมมาตร</div>\n<h2>9. Polygon Mesh</h2>\n<p>พื้นผิวของโมเดล 3D มักแทนด้วยรูปหลายเหลี่ยมจำนวนมากที่เชื่อมต่อกัน เรียกว่า Polygon Mesh</p>\n<p>องค์ประกอบสำคัญคือ</p>\n<div class=\"bullet\">• Vertex: จุดยอด</div>\n<div class=\"bullet\">• Edge: เส้นขอบที่เชื่อมจุดยอด</div>\n<div class=\"bullet\">• Face: พื้นที่หน้ารูปหลายเหลี่ยม</div>\n<p>รูปที่ใช้บ่อยคือสามเหลี่ยมและสี่เหลี่ยม</p>\n<p>เมื่อเพิ่มจำนวน Polygon จะสามารถแทนรูปทรงละเอียดขึ้น แต่ก็เพิ่มข้อมูลและภาระประมวลผล จึงต้องเลือกระดับรายละเอียดให้เหมาะกับงาน</p>\n<p>อีกแนวทางหนึ่งคือใช้ Parametric Surface เช่นพื้นผิวจาก NURBS เพื่อออกแบบรูปทรงเรียบ แต่ในกระบวนการแสดงผลหลายระบบจะต้องแปลงเป็น Mesh ก่อน</p>\n<h2>10. Material และ Texture</h2>\n<p>เมื่อได้รูปทรงแล้ว ต้องกำหนดว่าพื้นผิวตอบสนองต่อแสงอย่างไร</p>\n<div class=\"bullet\">• Material: คุณสมบัติของผิว เช่น สี ความมัน ความหยาบ ความโปร่งใส</div>\n<div class=\"bullet\">• Texture: รายละเอียดที่นำไปวางบนผิว เช่น ลายไม้ ลายอิฐ หรือภาพบนเสื้อ</div>\n<p>รูปทรงเดียวกันจึงดูเป็นพลาสติก โลหะ หรือไม้ได้ ขึ้นกับข้อมูลพื้นผิว</p>\n<h2>11. การเรนเดอร์ 3D</h2>\n<p>การเรนเดอร์นำ โมเดล + วัสดุ + แสง + กล้อง มาคำนวณเป็นภาพ</p>\n<p>แสงสะท้อนที่ควรรู้คือ</p>\n<div class=\"bullet\">• Specular Reflection: สะท้อนเป็นทิศทางเด่น เกิดไฮไลต์หรือความมันวาว</div>\n<div class=\"bullet\">• Diffuse Reflection: สะท้อนกระจาย เห็นได้ชัดในผิวด้าน</div>\n<p>ขั้นตอนแบบย่อในสไลด์มีสามขั้น</p>\n<p>1. Perspective Projection: ฉายจุดจากโลก 3D ลงบนระนาบภาพ โดยวัตถุไกลมักปรากฏเล็กลง</p>\n<p>2. Visibility Check: ตรวจว่าส่วนใดมองเห็นหรือถูกวัตถุอื่นบัง</p>\n<p>3. Shading: คำนวณสีและความสว่างบนพื้นผิว</p>\n<div class=\"tablewrap\"><table><tr><th>Shading</th><th>หลักการ</th><th>ผลที่เห็น</th></tr><tr><td>Flat</td><td>ใช้ค่าต่อหน้า Polygon</td><td>เห็นเหลี่ยมชัด</td></tr><tr><td>Gouraud</td><td>คำนวณแสงที่จุดยอด แล้วแทรกค่าสีภายในหน้า</td><td>ผิวดูเรียบขึ้น แต่อาจพลาดไฮไลต์บางจุด</td></tr><tr><td>Phong</td><td>แทรกค่า Normal แล้วคำนวณแสงต่อจุดภาพ</td><td>แสดงไฮไลต์ได้ละเอียดขึ้น ใช้การคำนวณมากขึ้น</td></tr></table></div>\n<p>จำท้ายบท: Vector เก็บรูปทรง, Bitmap เก็บพิกเซล, Modeling สร้างวัตถุ, Rendering สร้างภาพ และ Cubic Bézier ใช้จุดควบคุม 4 จุด</p>"}, "7": {"title": "Computer Animation", "html": "<p>อ้างอิง: เอกสาร Computer Animation โดยเฉพาะหน้า 6–29, 31–42, 44–72 และ 74–83</p>\n<h2>1. Animation คืออะไร</h2>\n<p>Animation คือการสร้างความรู้สึกว่าวัตถุหรือภาพเคลื่อนไหว โดยแสดงภาพต่อเนื่องที่มีการเปลี่ยนแปลงทีละน้อย</p>\n<p>ต้องแยกระหว่าง</p>\n<div class=\"bullet\">• จำนวนภาพที่แตกต่างกันจริงในหนึ่งวินาที</div>\n<div class=\"bullet\">• จำนวนครั้งที่ระบบแสดงหรือรีเฟรชภาพในหนึ่งวินาที</div>\n<p>งาน Animation สามารถใช้ภาพเดิมซ้ำหลายครั้งได้ จึงไม่ควรจำว่าต้องมีภาพใหม่อย่างน้อย 50 ภาพต่อวินาทีเสมอ ความลื่นขึ้นกับทั้งอัตราเฟรม ลักษณะการเคลื่อนที่ และการนำเสนอ</p>\n<h2>2. ประเภทของ Animation</h2>\n<p>Traditional Hand-drawn Animation</p>\n<p>วาดภาพแต่ละเฟรมด้วยมือ โดยเทคนิค Cel Animation แยกตัวละครกับฉากหลังออกจากกัน ทำให้ใช้ฉากเดิมซ้ำได้</p>\n<p>Multiplane Camera ใช้ภาพหลายชั้นที่อยู่คนละระยะ เมื่อกล้องหรือชั้นภาพเคลื่อนที่ จะเกิด Parallax คือวัตถุใกล้กับไกลดูเหมือนเคลื่อนด้วยอัตราต่างกัน ช่วยสร้างความลึก</p>\n<p>Computer-based Hand-drawn Animation</p>\n<p>ยังวาดภาพทีละเฟรม แต่ใช้คอมพิวเตอร์แทนวัสดุแบบเดิม ช่วยเรื่องเลเยอร์ การแก้ไข การดูตัวอย่าง และ Onion Skinning ซึ่งแสดงภาพเฟรมข้างเคียงแบบจางเพื่อช่วยวาดการเคลื่อนไหวต่อเนื่อง</p>\n<p>Stop-motion Animation</p>\n<p>ขยับวัตถุจริงเล็กน้อยแล้วถ่ายทีละเฟรม เช่น หุ่นหรือดินน้ำมัน เมื่อเล่นภาพต่อกันจะเห็นการเคลื่อนไหว</p>\n<p>2D Computer Animation</p>\n<p>ให้คอมพิวเตอร์ช่วยสร้างเฟรมระหว่างเฟรมหลัก โดยใช้การคำนวณ ไม่จำเป็นต้องวาดใหม่ทุกเฟรม</p>\n<p>3D Computer Animation</p>\n<p>ใช้โมเดลสามมิติ กำหนดการเคลื่อนไหว แสง กล้อง และอาจจำลองปรากฏการณ์ทางฟิสิกส์ ก่อนเรนเดอร์ภาพในแต่ละเฟรม</p>\n<p>3. Keyframe, In-between และ Tweening</p>\n<div class=\"bullet\">• Keyframe: เฟรมหลักที่กำหนดสถานะสำคัญ</div>\n<div class=\"bullet\">• In-between Frame: เฟรมระหว่าง Keyframe</div>\n<div class=\"bullet\">• Tweening: การสร้างสถานะหรือภาพระหว่าง Keyframe</div>\n<p>ตัวอย่าง: กำหนดให้ลูกบอลอยู่ที่ \\(x=0\\) ตอนเริ่ม และ \\(x=100\\) เมื่อผ่านไป 1 วินาที ระบบคำนวณตำแหน่งระหว่างนั้นให้</p>\n<p>สิ่งที่ Tween ได้ไม่ได้มีเพียงตำแหน่ง แต่รวมถึงขนาด มุมหมุน สี ความโปร่งใส และรูปร่าง</p>\n<h2>4. Interpolation</h2>\n<p>Interpolation คือการคำนวณค่าระหว่างค่าที่ทราบแล้ว</p>\n<p>Linear Interpolation ใช้</p>\n<div class=\"equation\">\\[V(t)=(1-t)V_0+tV_1\\]</div>\n<p>หาก \\(V_0=20\\), \\(V_1=80\\), \\(t=0.25\\)</p>\n<div class=\"equation\">\\[V(0.25)=0.75(20)+0.25(80)=35\\]</div>\n<p>ในงานกราฟิก Interpolation ใช้สร้างรูปร่างของเส้น ส่วนใน Animation ใช้คำนวณสถานะของวัตถุตามเวลา</p>\n<h2>5. Continuity ของเส้นโค้ง</h2>\n<p>การต่อเส้นสองช่วงอาจต่อกันได้ แต่ไม่ได้หมายความว่าจะเคลื่อนที่ผ่านรอยต่อนั้นอย่างนุ่มนวล</p>\n<div class=\"tablewrap\"><table><tr><th>ระดับ</th><th>เงื่อนไข</th><th>ความหมายใน Animation</th></tr><tr><td>\\(C^0/G^0\\)</td><td>จุดปลายชนกัน</td><td>ตำแหน่งไม่กระโดด แต่อาจมีมุมหัก</td></tr><tr><td>\\(G^1\\)</td><td>แนวสัมผัสมีทิศทางเดียวกัน</td><td>รูปทรงดูต่อเนื่อง แต่ขนาดความเร็วอาจต่าง</td></tr><tr><td>\\(C^1\\)</td><td>อนุพันธ์อันดับหนึ่งเท่ากัน</td><td>เวกเตอร์ความเร็วต่อเนื่องเมื่อใช้พารามิเตอร์เดียวกัน</td></tr><tr><td>\\(C^2\\)</td><td>อนุพันธ์อันดับสองเท่ากัน</td><td>ความเร่งต่อเนื่องเมื่อพารามิเตอร์สัมพันธ์กับเวลา</td></tr></table></div>\n<p>Geometric Continuity หรือ G เน้นความเรียบทางรูปทรง ส่วน Parametric Continuity หรือ C ควบคุมค่าของอนุพันธ์ด้วย</p>\n<p>จุดที่ควรระวังจากสไลด์คือ \\(G^2\\) หมายถึงความต่อเนื่องของความโค้ง การอธิบายว่าเพียง “อนุพันธ์อันดับสองมีทิศเดียวกัน” เป็นการย่อที่ไม่ครอบคลุมนิยามทั่วไป</p>\n<h2>6. Motion Path กับ Speed Control</h2>\n<p>Motion Path ตอบว่า “วัตถุเคลื่อนผ่านตำแหน่งใด”</p>\n<p>Speed Control ตอบว่า “วัตถุไปถึงแต่ละตำแหน่งเมื่อไร”</p>\n<p>สองอย่างนี้แยกจากกันได้ เช่น ใช้เส้นทางเดียวกัน แต่ให้รถคันหนึ่งวิ่งสม่ำเสมอ อีกคันค่อย ๆ เร่งแล้วชะลอ</p>\n<p>ข้อสำคัญคือ การเพิ่มพารามิเตอร์ของเส้นโค้งทีละเท่ากัน ไม่รับประกันว่าระยะที่เคลื่อนที่แต่ละครั้งจะเท่ากัน</p>\n<p>จึงอาจต้องใช้ Arc Length หรือระยะสะสมตามเส้นโค้งช่วยควบคุม</p>\n<p>ลำดับแนวคิดในสไลด์คือ</p>\n<div class=\"equation\">\\[t \\rightarrow S(t) \\rightarrow U(S(t)) \\rightarrow P(U(S(t)))\\]</div>\n<p>โดย</p>\n<div class=\"bullet\">• \\(t\\) คือเวลา</div>\n<div class=\"bullet\">• \\(S(t)\\) คือระยะสะสมที่ต้องการไปถึง</div>\n<div class=\"bullet\">• \\(U\\) แปลงระยะสะสมเป็นพารามิเตอร์ของเส้น</div>\n<div class=\"bullet\">• \\(P\\) ให้ตำแหน่งบนเส้น</div>\n<p>ความเร็วเป็นอัตราการเปลี่ยนระยะทาง ดังนั้นหากใช้ \\(S(t)\\) แทนระยะ ความเร็วจะสัมพันธ์กับ \\(dS/dt\\)</p>\n<p>7. Ease-in และ Ease-out</p>\n<div class=\"bullet\">• Ease-in: เริ่มช้าแล้วเร็วขึ้น</div>\n<div class=\"bullet\">• Ease-out: เริ่มเร็วแล้วค่อย ๆ ช้าลง</div>\n<div class=\"bullet\">• Ease-in-out: เริ่มช้า เร็วช่วงกลาง แล้วช้าช่วงท้าย</div>\n<p>การควบคุมลักษณะนี้ช่วยให้การเคลื่อนที่ดูมีน้ำหนักและเป็นธรรมชาติ เช่น รถออกตัวหรือประตูที่ค่อย ๆ หยุด</p>\n<h2>8. รูปแบบของ Tweening</h2>\n<p>Motion Animation</p>\n<p>เปลี่ยนตำแหน่ง มุมหมุน หรือขนาดของวัตถุ</p>\n<p>Shape Animation</p>\n<p>เปลี่ยนรูปร่างหรือคุณสมบัติ เช่น วงกลมกลายเป็นวงรี สีแดงเปลี่ยนเป็นสีน้ำเงิน หรือวัตถุค่อย ๆ โปร่งใส</p>\n<p>หลัก Squash and Stretch ใช้การยุบและยืดเพื่อสื่อแรงและความยืดหยุ่น โดยทั่วไปพยายามรักษาปริมาตรที่รับรู้ให้ใกล้เดิม เช่น ลูกบอลกระแทกพื้นแล้วแบนลงพร้อมกว้างขึ้น</p>\n<p>Morphing Animation</p>\n<p>เปลี่ยนภาพหนึ่งให้กลายเป็นอีกภาพอย่างต่อเนื่อง เช่น เปลี่ยนใบหน้าคน A เป็นคน B</p>\n<p>ประกอบด้วยสามขั้นหลัก</p>\n<p>1. Point Mapping: จับคู่ตำแหน่งสำคัญ เช่น ตา จมูก ปาก</p>\n<p>2. Warping: บิดรูปทรงให้จุดที่จับคู่เคลื่อนเข้าหากัน</p>\n<p>3. Cross-dissolving: ผสมสีของภาพต้นทางและปลายทาง</p>\n<p>Cross-dissolve อย่างเดียวไม่ใช่ Morphing ที่สมบูรณ์ เพราะเปลี่ยนการผสมภาพโดยไม่ได้ปรับรูปทรงให้สอดคล้องกัน</p>\n<h2>9. เทคนิคขั้นสูง</h2>\n<p>Hierarchical Modeling</p>\n<p>จัดวัตถุเป็นลำดับพ่อแม่ลูก เช่น ลำตัว → ต้นแขน → ปลายแขน → มือ เมื่อขยับต้นแขน ส่วนลูกจะได้รับผลตามไปด้วย</p>\n<p>Forward Kinematics — FK</p>\n<p>กำหนดมุมข้อต่อ แล้วคำนวณว่าปลายแขนหรือมืออยู่ที่ใด</p>\n<p>Inverse Kinematics — IK</p>\n<p>กำหนดเป้าหมายของมือหรือเท้า แล้วคำนวณมุมข้อต่อที่ทำให้ไปถึงเป้าหมายนั้น</p>\n<p>ตัวอย่าง: ต้องการให้มือจับลูกบิดประตู ใช้ IK เพื่อหาท่าของแขนที่เหมาะสม</p>\n<p>Physically-based Animation</p>\n<p>ใช้แบบจำลองทางฟิสิกส์สร้างการเคลื่อนไหว เช่น น้ำไหล ผ้าพลิ้ว ไฟ และวัตถุชนกัน</p>\n<p>Motion Capture และ Facial Animation</p>\n<p>บันทึกการเคลื่อนไหวของคนหรือใบหน้า แล้วนำข้อมูลไปขับเคลื่อนตัวละครดิจิทัล</p>\n<p>จำท้ายบท: Keyframe กำหนดสถานะหลัก, Interpolation คำนวณค่าระหว่างสถานะ, Path กำหนดทาง และ Speed Control กำหนดจังหวะเวลา</p>"}, "8": {"title": "Sound / Audio", "html": "<p>อ้างอิง: เอกสาร Sound โดยเฉพาะหน้า 6–29, 31–58, 60–75, 77–85 และ 87–98</p>\n<p>บทนี้ควรอ่านให้สามารถอธิบายเป็นลำดับเหตุและผลได้ เพราะอยู่ในขอบเขตอัตนัย</p>\n<h2>1. Sound กับ Audio</h2>\n<p>Sound คือการสั่นสะเทือนที่แพร่ผ่านตัวกลางในรูปคลื่นเสียง เช่น อากาศ น้ำ หรือของแข็ง</p>\n<p>Audio คือการแทนเสียงที่ได้ยินด้วยสัญญาณอิเล็กทรอนิกส์ มีทั้ง</p>\n<div class=\"bullet\">• Analog Audio: สัญญาณต่อเนื่อง</div>\n<div class=\"bullet\">• Digital Audio: ข้อมูลตัวเลขที่ได้จากการสุ่มตัวอย่างและแปลงระดับสัญญาณ</div>\n<p>ลำดับตัวอย่างคือ</p>\n<p>คนพูด → ความดันอากาศเปลี่ยนแปลง → ไมโครโฟน → สัญญาณไฟฟ้า → ADC → ข้อมูลดิจิทัล</p>\n<p>ช่วงความถี่ที่มนุษย์ได้ยินโดยประมาณคือ 20 Hz–20 kHz แต่ความสามารถจริงขึ้นกับบุคคล อายุ และระดับเสียงด้วย</p>\n<h2>2. คุณสมบัติของเสียง</h2>\n<p>Amplitude</p>\n<p>ขนาดการเปลี่ยนแปลงของสัญญาณ สัมพันธ์กับความเข้มและความดังที่รับรู้ แต่ความดังที่รู้สึกไม่ได้ขึ้นกับ Amplitude เพียงอย่างเดียว</p>\n<p>Frequency</p>\n<p>จำนวนรอบการสั่นต่อวินาที หน่วย Hz สัมพันธ์กับการรับรู้เสียงสูงต่ำหรือ Pitch</p>\n<div class=\"bullet\">• ความถี่ต่ำ → เสียงทุ้ม</div>\n<div class=\"bullet\">• ความถี่สูง → เสียงแหลม</div>\n<p>Wavelength</p>\n<p>ระยะระหว่างจุดที่มีเฟสตรงกันของคลื่นสองรอบติดกัน</p>\n<div class=\"equation\">\\[c=f\\lambda\\]</div>\n<p>เมื่อความเร็วเสียงในตัวกลางคงเดิม ความถี่สูงขึ้นจะมีความยาวคลื่นสั้นลง</p>\n<p>Spectrum</p>\n<p>แสดงว่าเสียงประกอบด้วยความถี่ใดบ้าง และแต่ละความถี่มีระดับเท่าใด</p>\n<p>เสียงเครื่องดนตรีสองชนิดอาจเล่นโน้ตเดียวกัน แต่ฟังต่างกันเพราะองค์ประกอบความถี่และการเปลี่ยนแปลงตามเวลาต่างกัน</p>\n<p>Fourier Transform เป็นเครื่องมือวิเคราะห์สัญญาณให้เห็นองค์ประกอบในโดเมนความถี่</p>\n<h2>3. Decibel และ dBFS</h2>\n<p>Decibel เป็นสเกลลอการิทึมที่ใช้เปรียบเทียบอัตราส่วน</p>\n<p>สำหรับความเข้มเสียง</p>\n<div class=\"equation\">\\[L=10\\log_{10}\\left(\\frac{I}{I_0}\\right)\\]</div>\n<p>ถ้าระดับต่างกัน 10 dB หมายถึงความเข้มต่างกัน 10 เท่า และถ้าต่างกัน 20 dB หมายถึง 100 เท่า</p>\n<p>ตัวอย่าง: 105 dB เทียบกับ 85 dB ต่างกัน 20 dB จึงมีอัตราส่วนความเข้ม 100 เท่า</p>\n<p>แต่ ความเข้ม 100 เท่าไม่ได้แปลว่ารู้สึกดัง 100 เท่า เพราะการรับรู้ของมนุษย์ไม่เป็นเส้นตรง</p>\n<p>dBFS — Decibels relative to Full Scale</p>\n<p>ใช้กับสัญญาณดิจิทัล โดยอ้างอิงระดับเต็มสเกล</p>\n<div class=\"bullet\">• 0 dBFS คือระดับเต็มสเกล</div>\n<div class=\"bullet\">• ค่าต่ำกว่านั้นเป็นค่าลบ เช่น −6 dBFS</div>\n<div class=\"bullet\">• หากสัญญาณเกินช่วงที่ระบบแบบจำกัดสเกลแทนได้ อาจเกิด Clipping</div>\n<p>0 dBFS จึงไม่ใช่ “ไม่มีเสียง”</p>\n<h2>4. การบันทึกและแปลงเสียงเป็นดิจิทัล</h2>\n<p>ไมโครโฟน</p>\n<p>แปลงความดันเสียงเป็นสัญญาณไฟฟ้าแอนะล็อก</p>\n<p>Sampling</p>\n<p>วัดค่าของสัญญาณตามช่วงเวลา อัตราการวัดต่อวินาทีเรียกว่า Sampling Rate</p>\n<p>ตัวอย่าง 48 kHz หมายถึงเก็บ 48,000 ตัวอย่างต่อวินาทีต่อช่องเสียง</p>\n<p>เพื่อเก็บย่านความถี่ได้โดยไม่เกิด Aliasing ต้องจำกัดความถี่ก่อนสุ่มตัวอย่าง และใช้อัตราสุ่มตัวอย่างสูงกว่าสองเท่าของความถี่สูงสุดที่ต้องการเก็บ โดยระบบจริงต้องเผื่อช่วงเปลี่ยนผ่านของตัวกรองด้วย</p>\n<p>Quantization</p>\n<p>นำค่าที่วัดได้ไปแทนด้วยระดับตัวเลขที่มีจำนวนจำกัด</p>\n<p>ถ้าใช้ \\(N\\) บิต จะมีระดับแทนค่าได้</p>\n<div class=\"equation\">\\[2^N\\]</div>\n<p>เช่น</p>\n<div class=\"bullet\">• 8 บิต → 256 ระดับ</div>\n<div class=\"bullet\">• 16 บิต → 65,536 ระดับ</div>\n<div class=\"bullet\">• 24 บิต → 16,777,216 ระดับ</div>\n<p>Sampling Rate เพิ่มความละเอียดตามเวลา ส่วน Bit Depth เพิ่มความละเอียดของระดับสัญญาณ</p>\n<h2>5. ขนาดข้อมูลเสียง PCM</h2>\n<p>สำหรับเสียง PCM ไม่บีบอัด</p>\n<div class=\"equation\">\\[\\text{Bitrate}\n=\n\\text{Sampling Rate}\n\\times\n\\text{Bit Depth}\n\\times\n\\text{จำนวนช่อง}\\]</div>\n<p>และ</p>\n<div class=\"equation\">\\[\\text{ขนาดข้อมูลเป็นไบต์}\n=\n\\frac{\\text{Bitrate}\\times\\text{ระยะเวลา}}{8}\\]</div>\n<p>ตัวอย่าง เสียง Stereo 48 kHz, 16-bit ยาว 1 นาที</p>\n<div class=\"equation\">\\[48{,}000\\times16\\times2\n=\n1{,}536{,}000\\text{ bits/s}\\]</div>\n<div class=\"equation\">\\[\\frac{1{,}536{,}000\\times60}{8}\n=\n11{,}520{,}000\\text{ bytes}\\]</div>\n<p>ประมาณ 11.52 MB แบบฐานสิบ โดยยังไม่รวมข้อมูลส่วนหัวไฟล์</p>\n<p>สูตรนี้ใช้กับ PCM ไม่บีบอัด หากเป็น MP3 หรือ AAC ให้ใช้ Bitrate ของข้อมูลที่บีบอัดแล้วในการประเมินขนาด</p>\n<h2>6. Dynamic Range และ Clipping</h2>\n<p>Dynamic Range คือช่วงระหว่างระดับเสียงต่ำสุดที่ใช้งานได้กับระดับสูงสุดที่ระบบรองรับได้ โดยมักเปรียบเทียบเป็น dB</p>\n<p>Clipping เกิดเมื่อสัญญาณเกินขอบเขตที่ระบบรับหรือแทนค่าได้ ทำให้ยอดคลื่นถูกตัดและเกิดความเพี้ยน</p>\n<p>การป้องกันคือปรับ Gain ให้เหมาะสม และเผื่อ Headroom สำหรับเสียงที่ดังขึ้นอย่างฉับพลัน</p>\n<p>การลดระดับเสียงหลังจากบันทึกจนคลิปแล้ว ไม่ได้ทำให้รูปร่างยอดคลื่นเดิมกลับคืนมาโดยอัตโนมัติ</p>\n<h2>7. Quantization Noise และ Dithering</h2>\n<p>Quantization Error คือความต่างระหว่างค่าต่อเนื่องจริงกับระดับตัวเลขที่ใช้แทน</p>\n<p>Bit Depth สูงขึ้นทำให้ขั้นของระดับเล็กลง โดยทั่วไปจึงลดความผิดพลาดจาก Quantization ได้</p>\n<p>สูตรอ้างอิงที่พบบ่อยคือ</p>\n<div class=\"equation\">\\[SQNR\\approx6.02N+1.76\\text{ dB}\\]</div>\n<p>สูตรนี้อยู่ภายใต้สมมติฐานเฉพาะ เช่น Quantizer อุดมคติและสัญญาณไซน์เต็มสเกล จึงไม่ใช่ค่ารับประกันของการบันทึกเสียงทุกกรณี</p>\n<p>Dithering คือการเติม Noise ระดับต่ำก่อน Quantization หรือก่อนลด Bit Depth เพื่อทำให้ความผิดพลาดไม่สัมพันธ์กับสัญญาณจนเกิด Distortion ที่ฟังได้ชัด</p>\n<p>ตัวอย่าง: ลดจาก 24-bit เป็น 16-bit</p>\n<p>ข้อแก้ความเข้าใจจากสไลด์: หน้า 29 สรุปว่า Dithering ลดความเพี้ยนจาก Clipping แต่หลักที่ถูกต้องคือช่วยจัดการความเพี้ยนจาก Quantization ไม่ได้ซ่อมสัญญาณที่ Clipping</p>\n<p>8. Audio Processing</p>\n<div class=\"tablewrap\"><table><tr><th>เทคนิค</th><th>หน้าที่</th><th>ตัวอย่าง</th></tr><tr><td>Filter</td><td>เลือกผ่านหรือลดย่านความถี่</td><td>ลดเสียงฮัมหรือเสียงรบกวนบางย่าน</td></tr><tr><td>Equalizer</td><td>ปรับสมดุลระดับเสียงแต่ละย่าน</td><td>เพิ่มความชัดของเสียงพูด</td></tr><tr><td>Reverb</td><td>จำลองเสียงสะท้อนของสถานที่</td><td>ทำให้เสียงเหมือนอยู่ในห้องหรือโบสถ์</td></tr><tr><td>Vocoder</td><td>ใช้ลักษณะเสียงหนึ่งควบคุมอีกเสียง</td><td>เสียงร้องแบบหุ่นยนต์</td></tr><tr><td>Auto-Tune</td><td>ตรวจและแก้ Pitch ให้เข้ากับโน้ตเป้าหมาย</td><td>แก้เสียงร้องเพี้ยน</td></tr></table></div>\n<p>ชนิดของ Filter</p>\n<div class=\"bullet\">• Low-pass: ผ่านความถี่ต่ำ ลดความถี่สูง</div>\n<div class=\"bullet\">• High-pass: ผ่านความถี่สูง ลดความถี่ต่ำ</div>\n<div class=\"bullet\">• Band-pass: ผ่านเฉพาะช่วงความถี่ที่กำหนด</div>\n<div class=\"bullet\">• Band-stop: ลดช่วงความถี่ที่กำหนด โดย Notch มักเป็นช่วงแคบ</div>\n<p>ชื่อ Filter บอกว่าส่วนใด ผ่าน เช่น High-pass ให้ความถี่สูงผ่าน</p>\n<p>Graphic EQ กับ Parametric EQ</p>\n<p>Graphic EQ แบ่งย่านความถี่ไว้ค่อนข้างตายตัว ผู้ใช้ปรับเพิ่มหรือลดแต่ละย่าน</p>\n<p>Parametric EQ ปรับพารามิเตอร์ เช่น ความถี่ศูนย์กลาง ระดับเพิ่มลด และความกว้างของย่านได้ยืดหยุ่นกว่า</p>\n<h2>9. Reverb</h2>\n<p>เมื่อฟังเสียงในห้อง เราไม่ได้ยินเฉพาะเสียงที่เดินทางตรงจากแหล่งกำเนิด แต่ได้ยินเสียงสะท้อนจากพื้น ผนัง และเพดานด้วย</p>\n<p>องค์ประกอบหลักคือ</p>\n<p>1. Direct Sound: เสียงตรงจากแหล่งกำเนิด</p>\n<p>2. Early Reflections: เสียงสะท้อนช่วงแรก ช่วยบอกขนาดและลักษณะพื้นที่</p>\n<p>3. Late Reverberation: เสียงสะท้อนจำนวนมากที่ซ้อนกันเป็นหางเสียงและค่อย ๆ จาง</p>\n<p>Echo คือเสียงสะท้อนที่แยกได้เป็นครั้งชัดเจน ส่วน Reverb คือเสียงสะท้อนที่ซ้อนกันหนาแน่น</p>\n<p>เสียงต้นฉบับที่ยังไม่เติมเอฟเฟกต์เรียกว่า Dry ส่วนเสียงที่ผ่านเอฟเฟกต์เรียกว่า Wet</p>\n<h2>10. Vocoder กับ Auto-Tune</h2>\n<p>Vocoder</p>\n<p>ใช้สองส่วนสำคัญ</p>\n<div class=\"bullet\">• Carrier: เสียงต้นกำเนิด เช่นเสียง Synthesizer</div>\n<div class=\"bullet\">• Modulator: เสียงที่ใช้วิเคราะห์รูปแบบ เช่นเสียงพูด</div>\n<p>ระบบวิเคราะห์ลักษณะของ Modulator แล้วใช้ควบคุม Carrier จึงได้เสียงเครื่องดนตรีที่มีรูปแบบคล้ายการออกเสียงของคน</p>\n<p>Auto-Tune</p>\n<p>มีลำดับหลัก</p>\n<p>1. ตรวจความถี่พื้นฐานหรือ Pitch</p>\n<p>2. เปรียบเทียบกับโน้ตใน Key/Scale ที่เลือก</p>\n<p>3. ปรับ Pitch เข้าหาโน้ตเป้าหมาย</p>\n<p>การแก้ช้าจะรักษาความเป็นธรรมชาติได้มากกว่า ส่วนการแก้รวดเร็วมากให้เอฟเฟกต์ Pitch กระโดดแบบหุ่นยนต์</p>\n<p>Vocoder เปลี่ยนลักษณะเสียงผ่าน Carrier/Modulator ส่วน Auto-Tune เน้นแก้ระดับเสียงสูงต่ำ</p>\n<h2>11. Lossless Audio Compression</h2>\n<p>บีบอัดแล้วสามารถถอดกลับเป็นข้อมูลต้นฉบับได้ครบ</p>\n<p>แนวคิดในสไลด์คือ Prediction</p>\n<p>1. ทำนายค่าตัวอย่างถัดไป</p>\n<p>2. หาความต่างระหว่างค่าจริงกับค่าทำนาย เรียกว่า Residual</p>\n<p>3. เข้ารหัส Residual อย่างมีประสิทธิภาพ</p>\n<p>ตัวอย่าง ค่าจริง 1000 และ 1003 หากใช้ค่าก่อนหน้าทำนายค่าถัดไป จะเก็บความต่าง \\(+3\\) แทนค่าขนาดใหญ่โดยตรง</p>\n<p>ตัวอย่าง Codec ได้แก่ FLAC, ALAC และ Dolby TrueHD</p>\n<p>ข้อควรระวังคือการเก็บผลต่างจะเป็น Lossless ได้เมื่อเก็บข้อมูลที่จำเป็นครบโดยไม่มีการสูญเสียจากการ Quantize ผลต่าง</p>\n<h2>12. Lossy Audio Compression</h2>\n<p>ยอมสูญเสียรายละเอียดบางส่วนเพื่อให้ข้อมูลเล็กลง โดยอาศัย Psychoacoustics หรือธรรมชาติการได้ยินของมนุษย์</p>\n<p>หลักสำคัญคือ</p>\n<p>Threshold of Hearing</p>\n<p>มนุษย์มีความไวต่อแต่ละความถี่ต่างกัน เสียงที่เบากว่าขีดเริ่มได้ยินอาจไม่จำเป็นต้องเก็บละเอียด</p>\n<p>Frequency Masking</p>\n<p>เสียงดังในย่านหนึ่งบดบังเสียงที่เบากว่าในย่านใกล้เคียง</p>\n<p>Temporal Masking</p>\n<p>เสียงดังบดบังเสียงอื่นที่อยู่ใกล้กันในเวลาได้ ทั้งช่วงก่อนและหลัง โดยผลและระยะเวลาไม่เท่ากัน</p>\n<p>กระบวนการเชิงแนวคิดคือ แยกวิเคราะห์ความถี่ → ประเมินสิ่งที่ผู้ฟังรับรู้ → จัดสรรบิตแต่ละย่าน → Quantize และเข้ารหัส</p>\n<p>ตัวอย่าง Codec ได้แก่ MP3, AAC และ Vorbis</p>\n<div class=\"tablewrap\"><table><tr><th>ประเด็น</th><th>Lossless</th><th>Lossy</th></tr><tr><td>คืนข้อมูลต้นฉบับครบ</td><td>ได้</td><td>ไม่ได้</td></tr><tr><td>อาศัยการตัดรายละเอียดที่รับรู้ได้น้อย</td><td>ไม่จำเป็น</td><td>ใช่</td></tr><tr><td>ขนาดข้อมูล</td><td>โดยทั่วไปใหญ่กว่า</td><td>โดยทั่วไปเล็กกว่า</td></tr><tr><td>งานเหมาะสม</td><td>เก็บต้นฉบับ งานผลิตเสียง</td><td>ส่งผ่านเครือข่ายหรือฟังทั่วไป</td></tr></table></div>\n<p>Codec กับ Container ต่างกัน</p>\n<p>Codec คือวิธีเข้ารหัส/ถอดรหัส เช่น AAC หรือ Vorbis</p>\n<p>Container คือโครงสร้างไฟล์ที่บรรจุข้อมูล เช่น M4A หรือ Ogg ดังนั้นนามสกุลไฟล์อย่างเดียวอาจไม่บอก Codec ได้ครบ</p>\n<p>13. Sound Synthesis</p>\n<div class=\"tablewrap\"><table><tr><th>วิธี</th><th>หลักการ</th></tr><tr><td>Additive</td><td>รวมคลื่นหลายองค์ประกอบเป็นเสียงใหม่</td></tr><tr><td>Subtractive</td><td>เริ่มจากเสียงที่มีองค์ประกอบความถี่มาก แล้วใช้ Filter ตัดบางส่วน</td></tr><tr><td>FM</td><td>ใช้ Modulator เปลี่ยนความถี่ของ Carrier</td></tr><tr><td>Granular</td><td>แบ่งเสียงเป็นชิ้นสั้น ๆ หรือ Grains แล้วจัดเรียง/ผสมใหม่</td></tr><tr><td>Wavetable</td><td>เก็บรูปคลื่นเป็นตาราง แล้วอ่านวนหรือเปลี่ยนระหว่างตาราง</td></tr><tr><td>Sample-based</td><td>เล่นเสียงที่บันทึกไว้ เช่นตัวอย่างเสียงเปียโน</td></tr></table></div>\n<p>จุดต่างที่ควรจำคือ Additive เพิ่มองค์ประกอบ ส่วน Subtractive ลดองค์ประกอบ</p>\n<p>Wavetable เน้นรูปคลื่นที่นำมาอ่านซ้ำและปรับ ส่วน Sample-based เน้นใช้เสียงที่บันทึกจริงเป็นวัตถุดิบ</p>\n<h2>14. Stereo และ 3D Audio</h2>\n<p>มนุษย์ระบุทิศทางเสียงจากหลายเบาะแส ได้แก่</p>\n<div class=\"bullet\">• ITD: เวลาที่เสียงมาถึงหูสองข้างต่างกัน</div>\n<div class=\"bullet\">• ILD: ระดับเสียงที่หูสองข้างได้รับต่างกัน</div>\n<div class=\"bullet\">• รูปแบบการกรองความถี่จากศีรษะและใบหูที่เปลี่ยนตามทิศทาง</div>\n<p>Stereo ใช้สองช่อง L/R เพื่อสร้างภาพเสียง เช่น ซ้าย กลาง ขวา</p>\n<p>Binaural Audio จำลองสิ่งที่หูแต่ละข้างควรได้รับ รวมผลของศีรษะและใบหู จึงช่วยสร้างทิศทางด้านหน้า หลัง บน หรือล่างได้ โดยมักฟังผ่านหูฟัง</p>\n<p>HRTF — Head-related Transfer Function อธิบายว่าศีรษะและใบหูเปลี่ยนเสียงจากแต่ละทิศทางอย่างไร</p>\n<p>ข้อควรแยก: Spatial Audio เป็นคำกว้าง ส่วน Binaural เป็นวิธีหนึ่งในการนำเสนอเสียงเชิงพื้นที่ และ Dolby Atmos เป็นระบบที่อาจนำไปเรนเดอร์ได้หลายรูปแบบ จึงไม่ใช่คำที่มีความหมายเหมือนกันทั้งหมด</p>\n<p>จำท้ายบท: Sampling Rate = เวลา, Bit Depth = ระดับ, Clipping = เกินสเกล, Dither = จัดการ Quantization, Lossy = ใช้ข้อจำกัดการได้ยิน และ HRTF = ผลจากศีรษะ/ใบหูตามทิศทาง</p>"}, "9": {"title": "Text & Typography", "html": "<p>อ้างอิง: เอกสาร Text &amp; Typography โดยเฉพาะหน้า 6–30, 32–51 และ 53–65</p>\n<p>1. คำศัพท์พื้นฐาน</p>\n<div class=\"tablewrap\"><table><tr><th>คำ</th><th>ความหมาย</th></tr><tr><td>Alphabet</td><td>ชุดตัวอักษรของภาษา</td></tr><tr><td>Letter</td><td>ตัวอักษรที่เป็นสมาชิกของชุด เช่น A</td></tr><tr><td>Character</td><td>หน่วยอักขระ เช่น ตัวอักษร ตัวเลข เครื่องหมาย</td></tr><tr><td>Text</td><td>ข้อมูลข้อความที่ประกอบจากอักขระ</td></tr><tr><td>Typeface</td><td>การออกแบบรูปลักษณ์ของชุดตัวอักษร</td></tr><tr><td>Font</td><td>การนำแบบตัวอักษรไปจัดเก็บและใช้งานในระบบดิจิทัล</td></tr><tr><td>Glyph</td><td>รูปที่ใช้แสดงอักขระ</td></tr></table></div>\n<p>ความสัมพันธ์ระหว่าง Character และ Glyph ไม่จำเป็นต้องเป็นหนึ่งต่อหนึ่ง เช่น ตัวอักษรหลายตัวอาจรวมแสดงเป็น Glyph เดียวแบบ Ligature หรืออักขระเดียวอาจมีรูปต่างกันตามตำแหน่งและบริบท</p>\n<p>Style Guide กำหนดแนวทางภาพลักษณ์ เช่น สีและการใช้ตัวอักษร</p>\n<p>Design System ครอบคลุมมากขึ้น เช่น ชุด Component ที่ใช้ซ้ำ โค้ด กฎ และแนวทางออกแบบให้ผลิตภัณฑ์สอดคล้องกัน</p>\n<h2>2. Character Encoding</h2>\n<p>คอมพิวเตอร์ต้องแทนตัวอักษรด้วยตัวเลขก่อนจึงเก็บและส่งได้</p>\n<p>ASCII</p>\n<p>ใช้ 7 บิต จึงมีได้ 128 ค่า รองรับอักษรอังกฤษ ตัวเลข เครื่องหมาย และรหัสควบคุม</p>\n<p>ระบบแบบ 8 บิตที่ใช้ช่วงค่าเพิ่มเติมอาศัย Code Page เช่น Windows-874 สำหรับภาษาไทย</p>\n<p>ปัญหาคือ</p>\n<div class=\"bullet\">• อ่านด้วย Code Page ผิดแล้วแสดงตัวอักษรผิด</div>\n<div class=\"bullet\">• จำนวนรหัสจำกัด</div>\n<div class=\"bullet\">• รองรับหลายภาษาในระบบเดียวกันได้ไม่สะดวก</div>\n<h2>3. Unicode</h2>\n<p>Unicode กำหนด Code Point ให้แก่อักขระ เช่น</p>\n<div class=\"bullet\">• A คือ U+0041</div>\n<div class=\"bullet\">• ก คือ U+0E01</div>\n<p>Code Point เป็นหมายเลขประจำอักขระ ยังต้องใช้รูปแบบการเข้ารหัสเพื่อแปลงเป็นหน่วยข้อมูลที่จัดเก็บจริง</p>\n<p>ลำดับที่ควรเข้าใจคือ</p>\n<p>Character → Code Point → Code Unit → Bytes</p>\n<p>Unicode แบ่งพื้นที่รหัสเป็น 17 Planes แต่ละ Plane มี \\(65,536\\) ตำแหน่ง โดย Plane 0 เรียกว่า Basic Multilingual Plane — BMP</p>\n<p>ไม่ใช่ทุกตำแหน่งในพื้นที่รหัสจะถูกกำหนดเป็นอักขระแล้วหรือใช้เป็น Unicode Scalar Value ได้</p>\n<p>4. UTF-8, UTF-16 และ UTF-32</p>\n<div class=\"tablewrap\"><table><tr><th>รูปแบบ</th><th>ขนาด Code Unit</th><th>จำนวนที่ใช้ต่อ Unicode Scalar Value</th></tr><tr><td>UTF-8</td><td>8 บิต</td><td>1–4 หน่วย หรือ 1–4 ไบต์</td></tr><tr><td>UTF-16</td><td>16 บิต</td><td>1–2 หน่วย หรือ 2–4 ไบต์</td></tr><tr><td>UTF-32</td><td>32 บิต</td><td>1 หน่วย หรือ 4 ไบต์</td></tr></table></div>\n<p>UTF-8</p>\n<div class=\"bullet\">• ASCII เดิมใช้ 1 ไบต์</div>\n<div class=\"bullet\">• อักษรไทยทั่วไปใช้ 3 ไบต์ต่อ Code Point</div>\n<div class=\"bullet\">• เข้ากันได้กับ ASCII ในช่วงรหัสเดิม</div>\n<p>UTF-16</p>\n<div class=\"bullet\">• อักขระใน BMP ที่เป็น Scalar Value ใช้ 1 Code Unit</div>\n<div class=\"bullet\">• อักขระนอก BMP ใช้ 2 Code Units เรียกว่า Surrogate Pair</div>\n<p>UTF-32</p>\n<p>ใช้ 4 ไบต์ต่อ Scalar Value แต่ข้อความที่มองเห็นเป็น “หนึ่งตัว” อาจประกอบด้วยหลาย Code Points ได้ เช่น อักษรรวมเครื่องหมายหรือ Emoji บางชุด</p>\n<p>ดังนั้น จำนวนตัวที่มองเห็น จำนวน Code Points และจำนวนไบต์อาจไม่เท่ากัน</p>\n<h2>5. Endianness</h2>\n<p>เป็นลำดับการจัดเก็บไบต์ของค่าที่มีหลายไบต์</p>\n<p>ตัวอย่างค่า 0x12345678</p>\n<div class=\"bullet\">• Big-endian: 12 34 56 78</div>\n<div class=\"bullet\">• Little-endian: 78 56 34 12</div>\n<p>ประเด็นนี้สำคัญกับ UTF-16 และ UTF-32 ส่วน UTF-8 ไม่มีปัญหาลำดับไบต์ใน Code Unit แบบเดียวกัน เพราะหนึ่ง Code Unit มีหนึ่งไบต์</p>\n<h2>6. Typography</h2>\n<p>Typography คือการจัดตัวอักษรให้อ่านได้ชัด อ่านต่อเนื่องสะดวก และมีความเหมาะสมทางภาพ</p>\n<div class=\"bullet\">• Legibility: แยกแยะตัวอักษรแต่ละตัวได้ง่าย</div>\n<div class=\"bullet\">• Readability: อ่านข้อความต่อเนื่องได้สะดวก</div>\n<p>การเลือกฟอนต์จึงต้องพิจารณาร่วมกับขนาด ช่องไฟ ความยาวบรรทัด ระยะบรรทัด และความต่างระหว่างข้อความกับพื้นหลัง</p>\n<h2>7. หน่วยวัดและการจัดตัวอักษร</h2>\n<p>Absolute Unit</p>\n<div class=\"bullet\">• 1 point = \\(1/72\\) นิ้ว</div>\n<div class=\"bullet\">• 1 pica = 12 points</div>\n<div class=\"bullet\">• 6 picas = 1 นิ้ว</div>\n<p>Relative Unit</p>\n<p>em อ้างอิงขนาดตัวพิมพ์ เช่น เมื่อขนาด 12 pt ค่า 1 em เท่ากับ 12 pt ในบริบทนั้น</p>\n<div class=\"tablewrap\"><table><tr><th>คำ</th><th>ความหมาย</th></tr><tr><td>Baseline</td><td>เส้นฐานที่ใช้จัดวางตัวอักษร</td></tr><tr><td>x-height</td><td>ความสูงของตัว x พิมพ์เล็ก</td></tr><tr><td>Meanline</td><td>แนวเส้นที่ระดับ x-height</td></tr><tr><td>Leading</td><td>ระยะระหว่าง Baseline ของสองบรรทัด</td></tr><tr><td>Tracking</td><td>การปรับช่องไฟโดยรวมของช่วงข้อความ</td></tr><tr><td>Kerning</td><td>การปรับช่องไฟของคู่อักษรเฉพาะ</td></tr></table></div>\n<p>ตัวอย่าง Kerning คือปรับช่องไฟคู่ “AV” เพื่อไม่ให้ดูห่างเกินไป แม้กรอบของตัวอักษรทั้งสองจะมีระยะตามค่าปกติแล้วก็ตาม</p>\n<p>8. ลักษณะ Typeface</p>\n<div class=\"bullet\">• Serif: มีเชิงหรือส่วนยื่นที่ปลายเส้น</div>\n<div class=\"bullet\">• Sans-serif: ไม่มีเชิง</div>\n<div class=\"bullet\">• Monospace: ทุกตัวใช้ความกว้างช่องเท่ากัน</div>\n<div class=\"bullet\">• Proportional: ความกว้างช่องต่างกันตามตัว</div>\n<div class=\"bullet\">• Weight: น้ำหนักเส้น เช่น Light, Regular, Bold</div>\n<div class=\"bullet\">• Italic: แบบเอียงที่ออกแบบรูปอักษรเฉพาะ</div>\n<div class=\"bullet\">• Oblique: การทำรูปปกติให้เอียง</div>\n<div class=\"bullet\">• Typeface Family: ชุดรูปแบบที่ออกแบบให้เข้ากัน เช่น Regular, Bold และ Italic</div>\n<p>สไลด์เสนอ Serif สำหรับเนื้อความและ Sans-serif สำหรับหัวเรื่อง แต่ควรเข้าใจว่าเป็นแนวทางทั่วไป ไม่ได้แปลว่า Serif อ่านง่ายกว่าเสมอ เพราะขึ้นกับการออกแบบ ภาษา ขนาด และอุปกรณ์ด้วย</p>\n<h2>9. Bitmap Font กับ Outline Font</h2>\n<p>Bitmap Font</p>\n<p>เก็บรูปอักษรเป็นพิกเซล เหมาะกับขนาดที่ออกแบบไว้ แต่หากต้องรองรับหลายขนาดหรือความหนาแน่นพิกเซล อาจต้องเก็บหลายชุด</p>\n<p>Outline Font</p>\n<p>เก็บขอบรูปอักษรเป็นเส้นและเส้นโค้ง สามารถคำนวณวาดใหม่ตามขนาดได้ และต้อง Rasterize ก่อนแสดงบนจอ</p>\n<p>ข้อมูลภายในฟอนต์อาจมี</p>\n<div class=\"bullet\">• รูปร่าง Glyph</div>\n<div class=\"bullet\">• Width Table</div>\n<div class=\"bullet\">• Kerning Table</div>\n<div class=\"bullet\">• ข้อมูลการจัดรูปอักษรและคำแนะนำการเรนเดอร์</div>\n<p>Hinting ช่วยปรับการแสดงเส้นให้เหมาะกับตารางพิกเซล โดยเฉพาะขนาดเล็ก</p>\n<p>10. รูปแบบฟอนต์</p>\n<div class=\"bullet\">• PostScript Type 1: รูปแบบเก่าที่เคยใช้มากในงานพิมพ์</div>\n<div class=\"bullet\">• TrueType: ฟอนต์ Outline ที่พัฒนาจากเทคโนโลยีของ Apple และ Microsoft</div>\n<div class=\"bullet\">• OpenType: รูปแบบที่รองรับข้อมูลฟอนต์และความสามารถด้าน Typography ได้หลากหลาย</div>\n<div class=\"bullet\">• WOFF/WOFF2: รูปแบบสำหรับส่งฟอนต์บนเว็บ โดยมีการบีบอัด</div>\n<div class=\"bullet\">• EOT: รูปแบบเว็บฟอนต์เก่าที่สัมพันธ์กับ Microsoft</div>\n<p>OpenType สามารถใช้ Outline แบบ TrueType หรือแบบ CFF/PostScript ได้ ไม่ได้หมายความว่าต้องใส่ Outline ทั้งสองแบบพร้อมกันในทุกไฟล์</p>\n<p>เว็บมักเรียกฟอนต์ผ่าน CSS @font-face และต้องคำนึงถึงสิทธิ์การใช้งาน เพราะสิทธิ์ติดตั้งบนเครื่อง สิทธิ์ใช้บนเว็บ และสิทธิ์แจกจ่ายไฟล์อาจต่างกัน</p>\n<p>จำท้ายบท: Unicode ระบุหมายเลขอักขระ, UTF กำหนดการเข้ารหัส, Glyph คือรูป, Kerning ปรับคู่ และ Tracking ปรับทั้งช่วงข้อความ</p>"}, "10": {"title": "Hypermedia and Web Platform", "html": "<p>อ้างอิง: เอกสาร Hypermedia and Web Platform โดยเฉพาะหน้า 6–10, 12–42 และ 44–49</p>\n<p>บทนี้อยู่ในขอบเขตอัตนัย จึงควรเชื่อมแนวคิด Hypermedia เข้ากับการทำงานของเว็บให้ได้</p>\n<h2>1. Linear กับ Nonlinear</h2>\n<p>Linear Media มีลำดับหลักค่อนข้างตายตัว เช่น ภาพยนตร์ที่เล่นตั้งแต่ต้นจนจบ</p>\n<p>Nonlinear Media เปิดให้เลือกเส้นทางหรือกระโดดไปยังส่วนต่าง ๆ เช่น เว็บที่มีลิงก์ หรือบทเรียนที่เลือกหัวข้อได้</p>\n<p>ความเป็น Linear/Nonlinear ขึ้นกับวิธีเข้าถึงด้วย หนังสืออาจอ่านเรียงหน้า หรือใช้สารบัญเลือกหัวข้อก็ได้</p>\n<h2>2. Hypertext และ Hypermedia</h2>\n<p>Hypertext คือเนื้อหาข้อความที่เชื่อมโยงกัน ผู้ใช้เลือกติดตามลิงก์ได้โดยไม่ต้องอ่านตามลำดับเดียว</p>\n<p>Hypermedia ขยายแนวคิดนี้ให้ครอบคลุมสื่อหลายชนิด เช่น ข้อความ ภาพ เสียง วิดีโอ และกราฟิกโต้ตอบ</p>\n<p>ตัวอย่าง: บทเรียนที่คลิกศัพท์เพื่ออ่านคำอธิบาย ฟังเสียง และเปิดวิดีโอสาธิต</p>\n<p>องค์ประกอบที่ช่วยอธิบายแนวคิดได้คือ</p>\n<div class=\"bullet\">• Node: หน่วยเนื้อหา</div>\n<div class=\"bullet\">• Link: ความเชื่อมโยง</div>\n<div class=\"bullet\">• Anchor: จุดที่ผู้ใช้เลือกเพื่อเดินทางตามลิงก์</div>\n<p>Multimedia เน้นการรวมสื่อหลายชนิด ส่วน Hypermedia เพิ่มการเชื่อมโยงและการเลือกเส้นทางเข้าถึงเนื้อหา</p>\n<h2>3. MEMEX</h2>\n<p>Vannevar Bush เสนอแนวคิด MEMEX ในปี 1945 เป็นเครื่องมือจัดเก็บ ค้นคืน ใส่คำอธิบาย และเชื่อมเอกสารเข้าด้วยกัน</p>\n<p>แนวคิดสำคัญคือมนุษย์ควรเข้าถึงความรู้ผ่านความสัมพันธ์ ไม่จำเป็นต้องใช้ลำดับตายตัว</p>\n<p>สิ่งที่คล้ายกับเว็บในปัจจุบัน ได้แก่ Hyperlink, Annotation และเส้นทางการติดตามเนื้อหา</p>\n<h2>4. World Wide Web</h2>\n<p>เว็บเป็นระบบเอกสารและทรัพยากรที่เชื่อมโยงกันและเข้าถึงผ่าน Browser</p>\n<p>องค์ประกอบหลักตามสไลด์คือ</p>\n<div class=\"tablewrap\"><table><tr><th>องค์ประกอบ</th><th>หน้าที่</th></tr><tr><td>HTML</td><td>กำหนดโครงสร้างและความหมายของเนื้อหา</td></tr><tr><td>HTTP</td><td>รับส่งข้อมูลระหว่าง Client และ Server</td></tr><tr><td>URL</td><td>ระบุตำแหน่งทรัพยากร</td></tr><tr><td>DOM</td><td>แทนโครงสร้างเอกสารในหน่วยความจำ</td></tr></table></div>\n<p>ตัวอย่าง เมื่อเปิดหน้าเว็บ Browser ใช้ URL ระบุทรัพยากร ส่งคำขอผ่าน HTTP/HTTPS รับ HTML แล้วนำมาสร้างโครงสร้างเพื่อแสดงผล</p>\n<h2>5. Markup Language</h2>\n<p>Markup เพิ่มเครื่องหมายเพื่อบอกโครงสร้างหรือการนำเสนอของข้อความ</p>\n<p>Procedural Markup</p>\n<p>เน้นคำสั่งว่าควรจัดหรือแสดงผลอย่างไร</p>\n<p>Descriptive Markup</p>\n<p>เน้นว่าส่วนของเอกสารคืออะไร เช่น หัวเรื่อง ย่อหน้า และรายการ</p>\n<p>HTML เน้นการอธิบายโครงสร้างและความหมายของเอกสาร ส่วนการนำเสนอโดยทั่วไปใช้ CSS</p>\n<p>HTML รุ่นแรกมีความสัมพันธ์กับ SGML แต่ HTML ปัจจุบันมีข้อกำหนดของตนเองและไม่ได้ใช้กฎ SGML แบบเดิมทั้งหมด</p>\n<h2>6. Element, Tag และ Attribute</h2>\n<p>ตัวอย่าง</p>\n<p>&lt;a href=&quot;/lesson/audio&quot;&gt;อ่านเรื่องเสียง&lt;/a&gt;</p>\n<div class=\"bullet\">• &lt;a&gt; และ &lt;/a&gt; คือ Tags</div>\n<div class=\"bullet\">• ส่วนประกอบทั้งหมดคือ Element</div>\n<div class=\"bullet\">• href คือชื่อ Attribute</div>\n<div class=\"bullet\">• &quot;/lesson/audio&quot; คือค่า Attribute</div>\n<div class=\"bullet\">• “อ่านเรื่องเสียง” คือข้อความภายใน</div>\n<p>ไม่ใช่ทุก Element ต้องมี Closing Tag เช่น &lt;img&gt; เป็น Void Element</p>\n<p>7. HTML, CSS และ JavaScript</p>\n<div class=\"bullet\">• HTML: มีเนื้อหาและโครงสร้างอะไร</div>\n<div class=\"bullet\">• CSS: จะแสดงหน้าตาอย่างไร</div>\n<div class=\"bullet\">• JavaScript: จะมีพฤติกรรมหรือการโต้ตอบอย่างไร</div>\n<p>ตัวอย่างปุ่มเล่นเสียง</p>\n<div class=\"bullet\">• HTML สร้างปุ่มและองค์ประกอบเสียง</div>\n<div class=\"bullet\">• CSS กำหนดสี ขนาด และตำแหน่ง</div>\n<div class=\"bullet\">• JavaScript จัดการเหตุการณ์คลิกและสั่งเล่นเสียง</div>\n<h2>8. DOM กับ DOM API</h2>\n<p>DOM — Document Object Model เป็นโครงสร้างวัตถุในหน่วยความจำที่แทนเอกสาร มักมีลักษณะเป็นต้นไม้</p>\n<p>Node อาจเป็น Element หรือข้อความ โดย Text Node เป็นโหนดข้อความ ไม่ใช่แท็ก</p>\n<p>DOM API เป็นวิธีมาตรฐานให้โปรแกรมเข้าถึงและเปลี่ยนโครงสร้างดังกล่าว เช่น</p>\n<p>document.getElementById(&quot;message&quot;).textContent = &quot;พร้อมเล่น&quot;;</p>\n<p>ตัวอย่างนี้ค้นหา Element ที่มี id=&quot;message&quot; แล้วเปลี่ยนข้อความที่แสดง</p>\n<p>ความต่างที่ต้องจำคือ DOM เป็นโครงสร้างข้อมูล ส่วน DOM API เป็นช่องทางที่ใช้จัดการโครงสร้างนั้น</p>\n<h2>9. Browser Renderer</h2>\n<p>ลำดับแบบย่อคือ</p>\n<p>1. Parse HTML และสร้าง DOM</p>\n<p>2. ประมวลผล CSS</p>\n<p>3. คำนวณรูปแบบและตำแหน่งหรือ Layout</p>\n<p>4. Paint ส่วนต่าง ๆ</p>\n<p>5. Composite เพื่อประกอบเป็นภาพที่แสดง</p>\n<p>JavaScript อาจเปลี่ยน DOM หรือ Style ทำให้ต้องคำนวณบางขั้นใหม่</p>\n<p>Main Thread รับผิดชอบงานสำคัญหลายอย่าง เช่น JavaScript และการจัดหน้า หากมีงานคำนวณหนักต่อเนื่อง UI อาจตอบสนองช้าหรือดูเหมือนค้าง</p>\n<h2>10. Web Worker</h2>\n<p>Web Worker เปิดให้รัน JavaScript ใน Worker Thread เพื่อย้ายงานบางชนิดออกจาก Main Thread</p>\n<p>เหมาะกับงาน เช่น</p>\n<div class=\"bullet\">• ประมวลผลภาพหรือเสียง</div>\n<div class=\"bullet\">• คำนวณข้อมูลจำนวนมาก</div>\n<div class=\"bullet\">• วิเคราะห์ข้อมูลสำหรับแอปมัลติมีเดีย</div>\n<p>Worker ส่งข้อมูลกลับมายัง Main Thread ผ่านกลไกข้อความ เช่น postMessage()</p>\n<p>Worker ทั่วไปเข้าถึง DOM ของหน้าโดยตรงไม่ได้ จึงให้ Worker คำนวณ แล้วส่งผลกลับมาให้ Main Thread อัปเดตหน้า</p>\n<p>การใช้ Worker ช่วยให้ UI ตอบสนองดีขึ้น แต่ไม่ได้รับประกันว่าทุกงานจะเร็วขึ้น เพราะมีต้นทุนการสร้าง Worker และรับส่งข้อมูล</p>\n<p>11. เทคโนโลยีเว็บสำหรับ Multimedia</p>\n<div class=\"bullet\">• Canvas: พื้นที่วาดภาพผ่านโปรแกรม เหมาะกับกราฟิกและการประมวลผลภาพ</div>\n<div class=\"bullet\">• WebGL: ใช้ GPU ช่วยเรนเดอร์กราฟิกบนเว็บ</div>\n<div class=\"bullet\">• WebXR: รองรับประสบการณ์และอุปกรณ์ AR/VR</div>\n<div class=\"bullet\">• Audio/Video Elements: เล่นสื่อบนหน้าเว็บ</div>\n<div class=\"bullet\">• WebSocket: สื่อสารสองทิศทางผ่านการเชื่อมต่อที่เปิดค้าง</div>\n<div class=\"bullet\">• Server-sent Events — SSE: ส่งเหตุการณ์จาก Server มายัง Client</div>\n<div class=\"bullet\">• Web Storage: เก็บข้อมูลแบบ Key–Value ฝั่ง Browser</div>\n<p>localStorage เก็บต่อหลังปิดและเปิด Browser โดยทั่วไป จนกว่าจะถูกลบ</p>\n<p>sessionStorage ผูกกับ Page Session โดยทั่วไปแยกตามแท็บและสิ้นสุดเมื่อ Session นั้นจบ</p>\n<h2>12. WCMS</h2>\n<p>Web Content Management System ช่วยสร้าง แก้ไข จัดการ และเผยแพร่เนื้อหาเว็บ</p>\n<p>องค์ประกอบหลักคือ</p>\n<div class=\"bullet\">• CMA — Content Management Application: เครื่องมือสำหรับผู้เขียนและผู้แก้ไข</div>\n<div class=\"bullet\">• CDA — Content Delivery Application: ส่วนจัดเตรียมและนำเสนอเนื้อหาแก่ผู้ใช้</div>\n<p>ความสามารถทั่วไป ได้แก่</p>\n<div class=\"bullet\">• WYSIWYG Editor</div>\n<div class=\"bullet\">• Template</div>\n<div class=\"bullet\">• Version History</div>\n<div class=\"bullet\">• รองรับหลายภาษา</div>\n<div class=\"bullet\">• Workflow เขียน → ตรวจ → เผยแพร่</div>\n<div class=\"bullet\">• Access Control</div>\n<div class=\"bullet\">• เครื่องมือช่วย SEO</div>\n<p>ตัวอย่างระบบ เช่น WordPress, Drupal, Joomla, Wix และ Shopify โดยความเหมาะสมขึ้นกับงาน</p>\n<p>จำท้ายบท: Hypermedia = สื่อเชื่อมโยงที่เลือกเส้นทางได้, HTML = โครงสร้าง, CSS = รูปลักษณ์, JavaScript = พฤติกรรม, DOM = โครงสร้างในหน่วยความจำ และ Worker = งานคำนวณแยกจาก Main Thread</p>"}, "11": {"title": "Multimedia Networking & Security / Streaming", "html": "<p>อ้างอิง: เอกสาร Multimedia Networking &amp; Security โดยเฉพาะหน้า 6–11, 13–31 และ 33–42</p>\n<p>ส่วน Streaming อยู่ในขอบเขตอัตนัย ควรอธิบายได้ทั้งหลักการ กระบวนการ และเหตุผลในการเลือกเทคโนโลยี</p>\n<h2>1. ประเภทแอปพลิเคชันมัลติมีเดียผ่านเครือข่าย</h2>\n<p>Interactive Multimedia</p>\n<p>เช่น Video Conference, VoIP และเกมออนไลน์ ต้องรับส่งข้อมูลโต้ตอบกันเร็ว หากหน่วงมากจะสนทนาหรือควบคุมได้ลำบาก</p>\n<p>Streaming Multimedia</p>\n<p>เช่น ดูหนัง ฟังเพลง หรือรับชมถ่ายทอดสด ยังต้องรักษาจังหวะการเล่น แต่หลายกรณียอมรอเริ่มต้นเพื่อสะสมข้อมูลได้</p>\n<p>แบ่งเป็น</p>\n<div class=\"bullet\">• Live Streaming: ส่งเนื้อหาที่กำลังเกิดขึ้น</div>\n<div class=\"bullet\">• On-demand Streaming: เลือกเล่นเนื้อหาที่เตรียมไว้แล้ว</div>\n<h2>2. Real-time ไม่ได้หมายถึงเร็วอย่างเดียว</h2>\n<p>Real-time หมายถึงงานต้องเสร็จหรือข้อมูลต้องมาถึงภายในเวลาที่กำหนด</p>\n<p>ความเร็วเฉลี่ยสูงอาจยังไม่พอ หากบางช่วงส่งช้าจนไม่ทัน Deadline</p>\n<div class=\"tablewrap\"><table><tr><th>ประเภท</th><th>ความหมาย</th></tr><tr><td>Hard Real-time</td><td>พลาด Deadline ถือเป็นความล้มเหลวที่ยอมรับไม่ได้</td></tr><tr><td>Firm Real-time</td><td>พลาดได้บางครั้ง แต่ผลที่ช้าเกินเวลาอาจไม่มีประโยชน์</td></tr><tr><td>Soft Real-time</td><td>ผลที่ช้ายังมีประโยชน์ แต่คุณภาพบริการลดลง</td></tr></table></div>\n<p>สำหรับวิดีโอ เฟรมที่มาถึงหลังเวลาที่ควรแสดงอาจต้องถูกทิ้ง แม้ข้อมูลจะมาถึงครบในภายหลังก็ตาม</p>\n<h2>3. คุณภาพเครือข่าย</h2>\n<p>Bandwidth คือความจุในการส่งข้อมูล ส่วน Throughput คืออัตราที่ส่งได้จริง</p>\n<p>Latency คือเวลาหน่วงในการเดินทางหรือประมวลผล</p>\n<p>ประเด็นเสริมที่ช่วยอธิบาย Streaming ได้แก่</p>\n<div class=\"bullet\">• Jitter: ความแปรปรวนของเวลามาถึง</div>\n<div class=\"bullet\">• Packet Loss: ข้อมูลบางส่วนสูญหาย</div>\n<div class=\"bullet\">• Buffer: ข้อมูลสำรองที่สะสมก่อนเล่น</div>\n<p>Buffer ช่วยรับความผันผวน แต่เพิ่มเวลารอและความหน่วง จึงต้องแลกกันระหว่างความต่อเนื่องกับความสดของเนื้อหา</p>\n<h2>4. ชั้นของ Protocol</h2>\n<p>Transport Layer</p>\n<div class=\"bullet\">• TCP: ส่งอย่างเชื่อถือได้และรักษาลำดับ มีการส่งใหม่เมื่อข้อมูลสูญหาย</div>\n<div class=\"bullet\">• UDP: ไม่รับประกันการส่งถึงหรือเรียงลำดับในตัว เหมาะเป็นฐานสำหรับระบบที่จัดการเวลาและการสูญเสียเอง</div>\n<div class=\"bullet\">• QUIC: ทำงานบน UDP แต่เพิ่มกลไกอย่างความเชื่อถือได้ หลาย Streams และความปลอดภัย เป็นฐานของ HTTP/3</div>\n<p>RTP และ RTCP</p>\n<div class=\"bullet\">• RTP: ส่งข้อมูลสื่อพร้อมข้อมูลอย่าง Timestamp และ Sequence Number</div>\n<div class=\"bullet\">• RTCP: ส่งข้อมูลควบคุมและรายงานเกี่ยวกับคุณภาพการรับส่ง</div>\n<p>Application Layer / ระบบ Streaming</p>\n<p>เช่น HTTP, HLS, DASH, RTSP, RTMP และชุดเทคโนโลยี WebRTC</p>\n<p>อย่าจำว่าใช้ UDP แล้วจะไม่มีการรับประกันใด ๆ เสมอ เพราะ Protocol ที่ทำงานทับ UDP สามารถเพิ่มกลไกเหล่านั้นได้ เช่น QUIC</p>\n<p>5. Streaming สามแนวทางหลัก</p>\n<div class=\"tablewrap\"><table><tr><th>แนวทาง</th><th>หลักการ</th><th>ตัวอย่าง</th></tr><tr><td>Progressive Download</td><td>ดาวน์โหลดไฟล์และเริ่มเล่นระหว่างโหลด</td><td>MP4 ผ่าน HTTP</td></tr><tr><td>True Streaming ตามการแบ่งในสไลด์</td><td>ส่งสื่อตาม Session และมีการควบคุม</td><td>RTSP, RTMP</td></tr><tr><td>Segmented Streaming</td><td>แบ่งเป็นช่วงสั้นและให้ Client ขอแต่ละช่วง</td><td>HLS, DASH</td></tr></table></div>\n<h2>6. Progressive Download</h2>\n<p>Browser ดาวน์โหลดไฟล์ผ่าน HTTP/HTTPS แล้วเริ่มเล่นเมื่อมีข้อมูลเพียงพอ โดยไม่ต้องรอไฟล์ครบ</p>\n<p>ไฟล์ MP4 มีส่วนข้อมูล Metadata เช่น moov atom ซึ่งให้ข้อมูลที่จำเป็นต่อการอ่าน Tracks และการเล่น</p>\n<p>หากวางข้อมูลนี้ไว้ตอนต้นไฟล์ Browser จะเริ่มทำความเข้าใจไฟล์และเล่นได้เร็วขึ้น แนวทางนี้มักเรียกว่า Fast Start</p>\n<p>Progressive Download แบบไฟล์เดียวไม่ได้มีการปรับ Bitrate หลายระดับอัตโนมัติเหมือน HLS/DASH โดยตัวมันเอง</p>\n<h2>7. RTSP</h2>\n<p>Real-time Streaming Protocol เน้นควบคุม Session เช่น PLAY, PAUSE และ TEARDOWN</p>\n<p>ข้อมูลสื่อมักส่งด้วย RTP และใช้ RTCP ประกอบ โดยอาจส่งผ่าน UDP หรือ TCP ตามรูปแบบระบบ</p>\n<p>ตัวอย่างการใช้คือกล้อง IP และระบบเฝ้าระวัง</p>\n<p>ประเด็นสำคัญ: RTSP เน้นควบคุมการเล่น ส่วน RTP มักรับหน้าที่ขนส่งข้อมูลสื่อ</p>\n<h2>8. RTMP / RTMPS</h2>\n<p>RTMP ปัจจุบันพบมากในขั้น Ingest คือส่งวิดีโอจากผู้ผลิตเข้าสู่ระบบ เช่น</p>\n<p>กล้อง → OBS → RTMP/RTMPS → แพลตฟอร์ม Live</p>\n<p>RTMPS เพิ่มการป้องกันการสื่อสารด้วย TLS</p>\n<p>Protocol ที่ใช้ส่งเข้าแพลตฟอร์มไม่จำเป็นต้องเป็นชนิดเดียวกับที่ใช้ส่งออกถึงผู้ชม เช่น รับเข้าด้วย RTMP แต่ส่งให้ผู้ชมด้วย HLS</p>\n<h2>9. HLS</h2>\n<p>HTTP Live Streaming พัฒนาโดย Apple ใช้ส่งผ่าน HTTP และรองรับทั้ง Live และ On-demand</p>\n<p>หลักการคือ</p>\n<p>1. เข้ารหัสสื่อ</p>\n<p>2. เตรียมคุณภาพหรือ Bitrate หลายระดับ</p>\n<p>3. แบ่งข้อมูลเป็น Segments</p>\n<p>4. สร้าง Playlist/Manifest ระบุข้อมูลที่ต้องใช้</p>\n<p>5. Client ดาวน์โหลด Playlist และเลือกขอ Segments</p>\n<p>6. เล่นต่อเนื่องและปรับคุณภาพตามสถานการณ์</p>\n<p>HLS ใช้ Playlist แบบ M3U8 โดย Segment อาจเป็น MPEG-2 TS หรือ Fragmented MP4</p>\n<p>Adaptive Bitrate — ABR</p>\n<p>หากเครือข่ายดี Client เลือกข้อมูลคุณภาพสูงขึ้น หากเครือข่ายช้าหรือ Buffer ลดลง อาจลด Bitrate เพื่อหลีกเลี่ยงภาพหยุด</p>\n<p>การเปลี่ยนคุณภาพอย่างต่อเนื่องต้องเตรียมแต่ละ Representation ให้สอดคล้องกันตามเวลา</p>\n<h2>10. DASH</h2>\n<p>Dynamic Adaptive Streaming over HTTP เป็นมาตรฐานจาก MPEG ใช้แนวคิดแบ่ง Segment และปรับ Bitrate เช่นเดียวกับ HLS</p>\n<p>DASH ใช้ Manifest ชื่อ MPD — Media Presentation Description ซึ่งเขียนด้วย XML</p>\n<div class=\"tablewrap\"><table><tr><th>ประเด็น</th><th>HLS</th><th>DASH</th></tr><tr><td>ผู้พัฒนา/มาตรฐาน</td><td>Apple</td><td>MPEG</td></tr><tr><td>Manifest</td><td>M3U8 Playlist</td><td>MPD แบบ XML</td></tr><tr><td>ส่งผ่าน HTTP</td><td>ใช่</td><td>ใช่</td></tr><tr><td>Adaptive Bitrate</td><td>รองรับ</td><td>รองรับ</td></tr><tr><td>Live / On-demand</td><td>รองรับ</td><td>รองรับ</td></tr></table></div>\n<p>ข้อควรระวังจากสไลด์: DASH ไม่ได้ใช้ได้เฉพาะ .ts ในการใช้งานปัจจุบัน Fragmented MP4 พบได้มาก สิ่งที่ควรจำหลัก ๆ คือ MPD และแนวคิด Adaptive Segmented Streaming</p>\n<h2>11. CDN</h2>\n<p>Content Delivery/Distribution Network คือเครือข่าย Server ที่กระจายหลายตำแหน่ง เพื่อช่วยส่งเนื้อหาให้ผู้ใช้จำนวนมาก</p>\n<p>ประโยชน์ ได้แก่</p>\n<div class=\"bullet\">• ลดภาระ Origin Server</div>\n<div class=\"bullet\">• กระจายปริมาณ Traffic</div>\n<div class=\"bullet\">• ลดระยะทางหรือปรับเส้นทางการส่งข้อมูล</div>\n<div class=\"bullet\">• Cache Segments ที่มีผู้ขอซ้ำ</div>\n<p>คำว่าเลือก Server “ใกล้” ไม่จำเป็นต้องหมายถึงใกล้ทางภูมิศาสตร์อย่างเดียว แต่พิจารณาเส้นทาง เครือข่าย และภาระระบบได้ด้วย</p>\n<p>CDN ช่วยส่งข้อมูล ส่วน ABR ช่วยเลือกระดับข้อมูลให้เหมาะกับผู้ใช้ จึงทำงานคนละส่วนแต่สนับสนุนกัน</p>\n<h2>12. กระบวนการ Live Streaming ทั้งระบบ</h2>\n<p>กล้อง/ไมโครโฟน → Encoder → Ingest → Transcoding → Packaging → CDN → Player</p>\n<p>แต่ละขั้นคือ</p>\n<div class=\"bullet\">• Encoder: แปลงสื่อเป็นข้อมูลเข้ารหัส</div>\n<div class=\"bullet\">• Ingest: รับสื่อเข้าสู่แพลตฟอร์ม</div>\n<div class=\"bullet\">• Transcoding: ถอดและเข้ารหัสใหม่ เช่น สร้างหลายความละเอียดหรือ Bitrate</div>\n<div class=\"bullet\">• Packaging: จัดข้อมูลเป็น Segments และ Manifest</div>\n<div class=\"bullet\">• CDN: กระจายเนื้อหา</div>\n<div class=\"bullet\">• Player: เลือก ดาวน์โหลด Buffer ถอดรหัส และเล่น</div>\n<p>Transcoding กับ Packaging ต่างกัน: การจัดใส่ Container หรือแบ่ง Segment โดยไม่เข้ารหัสสื่อใหม่ ไม่ใช่ Transcoding เสมอไป</p>\n<h2>13. ความปลอดภัยและ DRM</h2>\n<p>Transport Security</p>\n<p>เช่น HTTPS และ RTMPS ป้องกันข้อมูลระหว่างการส่งผ่านเครือข่าย</p>\n<p>DRM — Digital Rights Management</p>\n<p>ควบคุมสิทธิ์เข้าถึงและใช้เนื้อหา เช่น ใครดูได้ ดูถึงเมื่อไร และดูบนอุปกรณ์ใด</p>\n<p>ลำดับตัวอย่างคือ</p>\n<p>1. เข้ารหัสเนื้อหา</p>\n<p>2. ผู้ใช้ขอเล่น</p>\n<p>3. ระบบตรวจสิทธิ์</p>\n<p>4. License Server ออก License ตามเงื่อนไข</p>\n<p>5. ส่วนถอดรหัสบนอุปกรณ์ใช้ข้อมูลที่ได้รับเพื่อเล่นเนื้อหา</p>\n<p>ตัวอย่างระบบคือ Widevine, FairPlay และ PlayReady</p>\n<p>EME — Encrypted Media Extensions เป็น API/ข้อกำหนดที่ช่วยให้แอปเว็บประสานการเล่นเนื้อหาที่เข้ารหัสกับระบบที่รองรับ</p>\n<p>CDM — Content Decryption Module เป็นส่วนที่ทำงานเกี่ยวกับการถอดรหัสและการบังคับใช้สิทธิ์บน Client</p>\n<p>Watermark คือข้อมูลระบุตัวตนหรือเครื่องหมายที่ฝังในเนื้อหา ใช้ช่วยติดตามที่มาของสำเนาหรือการเผยแพร่</p>\n<div class=\"tablewrap\"><table><tr><th>เทคโนโลยี</th><th>หน้าที่หลัก</th></tr><tr><td>HTTPS</td><td>ป้องกันข้อมูลระหว่างทาง</td></tr><tr><td>DRM</td><td>ควบคุมสิทธิ์และการเข้าถึงเนื้อหา</td></tr><tr><td>Watermark</td><td>ช่วยระบุหรือติดตามที่มาของเนื้อหา</td></tr></table></div>\n<p>DRM ไม่ได้แปลว่าสามารถป้องกันการคัดลอกได้สมบูรณ์ทุกวิธี</p>\n<p>จำท้ายบท: Real-time = ทันเวลา, Buffer แลกความลื่นกับความหน่วง, RTMP พบมากใน Ingest, HLS/DASH แบ่ง Segment และปรับ Bitrate, CDN กระจายข้อมูล และ DRM ควบคุมสิทธิ์</p>"}, "12": {"title": "Multimedia Devices", "html": "<p>อ้างอิง: เอกสาร Multimedia Devices โดยเฉพาะหน้า 7–20, 22–26 และ 28–34</p>\n<h2>1. ระบบ Multimedia ทำงานอย่างไร</h2>\n<p>ลำดับหลักคือ</p>\n<p>Capture → Digitize → Process → Store/Transmit → Present</p>\n<p>ตัวอย่าง Video Call</p>\n<p>1. กล้องและไมโครโฟนรับภาพกับเสียง</p>\n<p>2. แปลงเป็นข้อมูลดิจิทัล</p>\n<p>3. ประมวลผล เช่น ตัด Noise และบีบอัด</p>\n<p>4. ส่งผ่านเครือข่าย</p>\n<p>5. ฝั่งรับถอดรหัสและแสดงผ่านจอกับลำโพง</p>\n<p>อุปกรณ์หนึ่งเครื่องอาจรวมหลายหน้าที่ เช่น Smartphone มีทั้ง Sensor, CPU, GPU, NPU, จอภาพ และลำโพง</p>\n<p>2. ประเภทอุปกรณ์</p>\n<div class=\"bullet\">• Computing Devices: PC, Laptop, Smartphone, Tablet, Game Console, Smart TV</div>\n<div class=\"bullet\">• Processing Devices: CPU, GPU, NPU และหน่วยเฉพาะด้าน</div>\n<div class=\"bullet\">• Output Devices: จอภาพ ลำโพง และอุปกรณ์ Haptic</div>\n<div class=\"bullet\">• Input Devices: Keyboard, Mouse, Touchscreen, Camera, Microphone และ Motion Sensors</div>\n<p>3. CPU, GPU และ NPU</p>\n<div class=\"tablewrap\"><table><tr><th>หน่วยประมวลผล</th><th>จุดเด่น</th><th>ตัวอย่างงาน</th></tr><tr><td>CPU</td><td>ยืดหยุ่น จัดการตรรกะและงานทั่วไป</td><td>ควบคุมโปรแกรมและระบบ</td></tr><tr><td>GPU</td><td>ประมวลผลข้อมูลจำนวนมากแบบขนาน</td><td>เรนเดอร์ภาพ ประมวลผลภาพ และงาน AI บางชนิด</td></tr><tr><td>NPU</td><td>เร่งงาน Neural Network ที่รองรับอย่างประหยัดพลังงาน</td><td>แยกเสียงพูด ตรวจจับวัตถุ และประมวลผล AI บนอุปกรณ์</td></tr></table></div>\n<p>GPU เหมาะกับการคำนวณลักษณะเดียวกันกับข้อมูลจำนวนมาก ส่วน NPU ออกแบบให้เหมาะกับงาน Neural Network เช่น Matrix Operations และ Multiply-Accumulate</p>\n<p>NPU ไม่ได้แทน CPU/GPU ทั้งหมด ความเหมาะสมขึ้นกับโมเดล รูปแบบตัวเลข และ Software ที่รองรับ</p>\n<h2>4. Integrated GPU กับ Discrete GPU</h2>\n<p>Integrated GPU</p>\n<p>อยู่ร่วมแพ็กเกจหรือชิปกับหน่วยประมวลผล และโดยทั่วไปใช้หน่วยความจำระบบร่วมกัน เหมาะกับงานทั่วไปและอุปกรณ์ที่เน้นพลังงาน</p>\n<p>Discrete GPU</p>\n<p>เป็นหน่วยแยก โดยทั่วไปมี VRAM ของตนเอง เหมาะกับงานหนัก เช่น เกม 3D, Rendering, VR และงานวิดีโอบางประเภท</p>\n<p>ความสามารถของ GPU สมัยใหม่อาจรวม Ray Tracing, AI Upscaling, Frame Interpolation และ Media Engine สำหรับเข้ารหัส/ถอดรหัสวิดีโอ</p>\n<p>5. ตัวอย่างงาน NPU ใน Multimedia</p>\n<div class=\"bullet\">• แยกคนออกจากฉากหลัง</div>\n<div class=\"bullet\">• ทำ Background Blur ใน Video Call</div>\n<div class=\"bullet\">• ลด Noise ของภาพและเสียง</div>\n<div class=\"bullet\">• Speech Recognition และคำบรรยาย</div>\n<div class=\"bullet\">• ติดตามใบหน้า มือ และร่างกาย</div>\n<div class=\"bullet\">• เพิ่มความละเอียดภาพด้วย AI</div>\n<div class=\"bullet\">• ประมวลผล Generative AI บางงานบนอุปกรณ์</div>\n<p>6. คุณสมบัติของจอภาพ</p>\n<div class=\"tablewrap\"><table><tr><th>คุณสมบัติ</th><th>ความหมาย</th></tr><tr><td>Resolution</td><td>จำนวนพิกเซลแนวนอน × แนวตั้ง</td></tr><tr><td>PPI</td><td>ความหนาแน่นของพิกเซลต่อนิ้ว</td></tr><tr><td>Aspect Ratio</td><td>อัตราส่วนความกว้างต่อความสูง</td></tr><tr><td>Refresh Rate</td><td>จำนวนครั้งที่จออัปเดตต่อวินาที หน่วย Hz</td></tr><tr><td>Response Time</td><td>เวลาที่พิกเซลใช้เปลี่ยนสถานะ</td></tr><tr><td>Color Depth</td><td>จำนวนบิตที่ใช้แทนระดับสี</td></tr><tr><td>Color Gamut</td><td>ขอบเขตสีที่แสดงได้</td></tr><tr><td>Contrast Ratio</td><td>อัตราส่วนความสว่างของสีขาวต่อสีดำ</td></tr><tr><td>Brightness</td><td>ความสว่าง มักระบุเป็น nit หรือ cd/m²</td></tr></table></div>\n<p>Resolution กับ PPI</p>\n<p>จอสองขนาดที่มี Resolution เท่ากัน จอเล็กมี PPI สูงกว่า</p>\n<p>ตัวอย่าง 1920×1080 หมายถึงจำนวนพิกเซล ไม่ได้บอกขนาดจอจริง</p>\n<p>Refresh Rate กับ FPS</p>\n<div class=\"bullet\">• Refresh Rate เป็นความสามารถการอัปเดตของจอ</div>\n<div class=\"bullet\">• FPS เป็นอัตราเฟรมของเนื้อหาหรือที่ระบบสร้างได้</div>\n<p>จอ 144 Hz ไม่ได้ทำให้วิดีโอ 24 FPS มีภาพต้นฉบับใหม่ 144 ภาพต่อวินาทีโดยอัตโนมัติ</p>\n<p>Response Time กับ Latency</p>\n<p>Response Time เน้นการเปลี่ยนสถานะของพิกเซล ส่วนความหน่วงจากกดปุ่มจนเห็นผลยังรวมส่วนอื่น เช่น การประมวลผลและการส่งข้อมูล</p>\n<p>Color Depth</p>\n<p>ถ้า RGB ใช้ช่องละ 8 บิต จะรวม 24 บิต และมีชุดค่าทางทฤษฎี</p>\n<div class=\"equation\">\\[2^{24}=16{,}777{,}216\\]</div>\n<p>ถ้าช่องละ 10 บิต จะรวม 30 บิต หรือประมาณ 1.07 พันล้านชุดค่า</p>\n<p>Color Depth มากไม่ได้แปลว่า Color Gamut กว้างขึ้นโดยอัตโนมัติ เพราะอย่างหนึ่งคือความละเอียดในการแบ่งระดับ อีกอย่างคือขอบเขตสีที่ทำได้</p>\n<p>7. เทคโนโลยีจอ</p>\n<div class=\"tablewrap\"><table><tr><th>เทคโนโลยี</th><th>หลักการ</th><th>จุดเด่น</th><th>ข้อจำกัด</th></tr><tr><td>LCD</td><td>ใช้ผลึกเหลวควบคุมแสงจาก Backlight</td><td>แพร่หลาย ราคาหลากหลาย</td><td>สีดำขึ้นกับการกั้นแสงและระบบ Backlight</td></tr><tr><td>Mini-LED LCD</td><td>LCD ที่ใช้ Backlight ขนาดเล็กหลายโซน</td><td>สว่างสูง ควบคุมแสงเป็นโซน</td><td>อาจเกิด Blooming</td></tr><tr><td>OLED</td><td>พิกเซลเปล่งแสงเอง</td><td>สีดำลึก ตอบสนองเร็ว</td><td>มีความเสี่ยง Burn-in ตามการใช้งาน</td></tr><tr><td>MicroLED</td><td>LED อนินทรีย์เปล่งแสงเอง</td><td>สว่างสูง Contrast สูง</td><td>ผลิตยากและราคาแพง</td></tr><tr><td>E-paper</td><td>ใช้การสะท้อนแสงเป็นหลัก</td><td>ประหยัดไฟ เหมาะกับการอ่าน</td><td>Refresh ช้าและข้อจำกัดด้านสี</td></tr></table></div>\n<p>Mini-LED กับ MicroLED จึงต่างกัน: Mini-LED ในตารางนี้เป็น Backlight ของ LCD ส่วน MicroLED เป็นพิกเซลเปล่งแสงเอง</p>\n<h2>8. Accelerometer และ Gyroscope</h2>\n<p>Accelerometer</p>\n<p>วัดความเร่งจำเพาะตามแกนต่าง ๆ ค่าที่อ่านเมื่ออยู่นิ่งสัมพันธ์กับแรงพยุงต้านแรงโน้มถ่วง จึงนำมาช่วยประเมินความเอียงได้</p>\n<p>ใช้ในโทรศัพท์ ระบบตรวจการเคลื่อนไหว โดรน และอุปกรณ์ติดตามกิจกรรม</p>\n<p>Gyroscope</p>\n<p>ในอุปกรณ์ทั่วไปวัดอัตราการหมุนรอบแกน แล้วนำไปคำนวณการเปลี่ยนมุมหรือ Orientation</p>\n<p>ใช้ติดตามการหมุนของโทรศัพท์ VR Headset และ Controller</p>\n<div class=\"tablewrap\"><table><tr><th>ประเด็น</th><th>Accelerometer</th><th>Gyroscope</th></tr><tr><td>ข้อมูลหลัก</td><td>ความเร่งจำเพาะ</td><td>อัตราการหมุน</td></tr><tr><td>ใช้ช่วยตรวจ</td><td>การเคลื่อนไหว การเอียง</td><td>การหมุนและเปลี่ยนทิศ</td></tr><tr><td>ทำงานร่วมกัน</td><td>ใช่</td><td>ใช่</td></tr></table></div>\n<p>การรวม Sensor หลายชนิดเรียกว่า Sensor Fusion ช่วยให้การติดตามการเคลื่อนไหวแม่นยำและเสถียรขึ้น</p>\n<h2>9. Haptic Devices</h2>\n<p>สร้างประสบการณ์สัมผัส เช่น การสั่น แรงกด หรือแรงต้าน</p>\n<div class=\"bullet\">• Tactile Feedback: ความรู้สึกบริเวณผิว เช่น โทรศัพท์สั่น</div>\n<div class=\"bullet\">• Force Feedback: แรงต้านหรือแรงผลักดึง เช่น พวงมาลัยเกมต้านมือ</div>\n<p>อุปกรณ์หนึ่งอาจรับ Input พร้อมส่ง Haptic Output ได้ เช่น Controller</p>\n<p>จำท้ายบท: CPU งานทั่วไป, GPU งานขนาน, NPU งาน Neural Network, Refresh Rate ต่างจาก FPS และ Accelerometer ต่างจาก Gyroscope</p>"}};const chapterFigures={"6": "<figure><svg viewBox=\"0 0 760 270\" role=\"img\" aria-label=\"Cubic Bézier: เส้นผ่าน P₀ และ P₃ ส่วน P₁ และ P₂ ควบคุมแนวโค้ง โดยเส้นไม่จำเป็นต้องผ่านสองจุดนี้\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8\" fill=\"#9abf91\"/></marker></defs><g font-family=\"Tahoma,sans-serif\" fill=\"#d4e3d4\" font-size=\"17\"><path d=\"M80 210L230 30M530 30L680 210\" stroke=\"#6f8580\" stroke-dasharray=\"7 7\"/><path d=\"M80 210C230 30 530 30 680 210\" fill=\"none\" stroke=\"#c6db85\" stroke-width=\"5\"/><circle cx=\"80\" cy=\"210\" r=\"7\" fill=\"#7fc5c0\"/><text x=\"80\" y=\"195\" text-anchor=\"middle\">P0</text><circle cx=\"230\" cy=\"30\" r=\"7\" fill=\"#7fc5c0\"/><text x=\"230\" y=\"15\" text-anchor=\"middle\">P1</text><circle cx=\"530\" cy=\"30\" r=\"7\" fill=\"#7fc5c0\"/><text x=\"530\" y=\"15\" text-anchor=\"middle\">P2</text><circle cx=\"680\" cy=\"210\" r=\"7\" fill=\"#7fc5c0\"/><text x=\"680\" y=\"195\" text-anchor=\"middle\">P3</text></g></svg><figcaption>Cubic Bézier: เส้นผ่าน P₀ และ P₃ ส่วน P₁ และ P₂ ควบคุมแนวโค้ง โดยเส้นไม่จำเป็นต้องผ่านสองจุดนี้</figcaption></figure>", "7": "<figure><svg viewBox=\"0 0 760 270\" role=\"img\" aria-label=\"แต่ละจุดห่างกันด้วยเวลาเท่ากัน: ช่องว่างมากหมายถึงเคลื่อนที่เร็วขึ้น Ease-in เร่งช่วงท้าย ส่วน Ease-out ชะลอช่วงท้าย\" xmlns=\"http://
